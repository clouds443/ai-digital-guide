    function createRealtimeClient() {
      return {
        ws: null,
        stream: null,
        audioContext: null,
        workletNode: null,
        processorNode: null,
        sourceNode: null,
        silentGain: null,
        connected: false,
        started: false,
        sessionActive: false,
        turnState: "idle",
        bargeInArmed: false,
        bargeInSpeechMs: 0,
        bargeInLastAt: 0,
        pendingServerListening: false,
        playbackGeneration: 0,
        answerIndex: -1,
        lastVoiceQuery: "",
        realtimeStatus: null,
        speechRmsThreshold: 0,
        audioQueue: Promise.resolve(),
        frameSamples: 3200,
        pendingPcm: new Int16Array(6400),
        pendingLength: 0,
        async start() {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前浏览器不支持麦克风采集。");
          }
          stopSpeech();
          this.stream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, noiseSuppression: true, echoCancellation: true, autoGainControl: true }
          });
          this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (this.audioContext.state === "suspended") {
            await this.audioContext.resume();
          }
          this.sourceNode = this.audioContext.createMediaStreamSource(this.stream);
          await this.setupRealtimeCapture();
          this.ws = new WebSocket(realtimeWsUrl());
          this.ws.binaryType = "arraybuffer";
          this.ws.onmessage = (event) => this.handleMessage(event);
          this.ws.onclose = () => this.cleanup(false);
          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error("实时服务连接超时，请确认 8010 服务已启动。")), 3500);
            this.ws.onopen = () => { clearTimeout(timer); resolve(); };
            this.ws.onerror = () => { clearTimeout(timer); reject(new Error("无法连接实时语音服务 8010。")); };
          });
          this.connected = true;
          this.silentGain = this.audioContext.createGain();
          this.silentGain.gain.value = 0;
          if (this.workletNode) this.workletNode.connect(this.silentGain);
          if (this.processorNode) this.processorNode.connect(this.silentGain);
          this.silentGain.connect(this.audioContext.destination);
          state.lastVoiceQuery = "";
          this.lastVoiceQuery = "";
          const history = state.messages.slice(-10).map(m => ({ role: m.role, content: m.content }));
          this.ws.send(JSON.stringify({ type: "start", mode: "continuous", allow_barge_in: true, interest: state.interest || "", history }));
          this.started = true;
          this.sessionActive = true;
          this.turnState = "listening";
          state.voiceMode = "realtime";
          state.realtimeSessionActive = true;
          state.realtimeTurnState = "listening";
          state.isListening = true;
          state.isTyping = false;
          state.realtimeTranscript = "";
          state.realtimeAnswer = "";
          postLive2D({ listen: true });
          render();
          const status = $("voiceStatusText");
          if (status) status.textContent = "正在听您说话，请用正常音量说话，说完停顿会自动提交" + (this.realtimeStatus && this.realtimeStatus.asr && !this.realtimeStatus.asr.loaded ? "，首次识别会稍慢" : "");
        },
        async setupRealtimeCapture() {
          if (this.audioContext.audioWorklet && window.AudioWorkletNode) {
            try {
              await this.audioContext.audioWorklet.addModule("/realtime-audio-worklet.js");
              this.workletNode = new AudioWorkletNode(this.audioContext, "lingshan-pcm-processor");
              this.workletNode.port.onmessage = (event) => this.sendRealtimePcm(event.data);
              this.sourceNode.connect(this.workletNode);
              return;
            } catch (e) {
              console.warn("AudioWorklet unavailable, using ScriptProcessor realtime capture.", e);
            }
          }
          this.processorNode = this.audioContext.createScriptProcessor(4096, 1, 1);
          this.processorNode.onaudioprocess = (event) => {
            const input = event.inputBuffer && event.inputBuffer.getChannelData(0);
            if (!input || !input.length) return;
            const pcm = this.downsampleToPcm16(input, this.audioContext.sampleRate, 16000);
            this.enqueueRealtimePcm(pcm);
          };
          this.sourceNode.connect(this.processorNode);
        },
        downsampleToPcm16(input, sourceRate, targetRate) {
          const ratio = sourceRate / targetRate;
          const outLength = Math.max(0, Math.floor(input.length / ratio));
          const pcm = new Int16Array(outLength);
          for (let i = 0; i < outLength; i += 1) {
            const sourceIndex = Math.min(input.length - 1, Math.floor(i * ratio));
            const sample = Math.max(-1, Math.min(1, input[sourceIndex]));
            pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
          }
          return pcm;
        },
        enqueueRealtimePcm(pcm) {
          if (!pcm || !pcm.length) return;
          if (this.pendingLength + pcm.length > this.pendingPcm.length) {
            const grown = new Int16Array((this.pendingLength + pcm.length) * 2);
            grown.set(this.pendingPcm.subarray(0, this.pendingLength), 0);
            this.pendingPcm = grown;
          }
          this.pendingPcm.set(pcm, this.pendingLength);
          this.pendingLength += pcm.length;
          while (this.pendingLength >= this.frameSamples) {
            const frame = new Int16Array(this.frameSamples);
            frame.set(this.pendingPcm.subarray(0, this.frameSamples), 0);
            this.sendRealtimePcm(frame.buffer);
            this.pendingPcm.copyWithin(0, this.frameSamples, this.pendingLength);
            this.pendingLength -= this.frameSamples;
          }
        },
        sendRealtimePcm(buffer) {
          if (!this.ws || this.ws.readyState !== WebSocket.OPEN || !this.started || !this.sessionActive || !buffer || !buffer.byteLength) return;
          if (this.turnState === "answering" || this.turnState === "speaking") {
            this.maybeTriggerRealtimeBargeIn(buffer);
            return;
          }
          if (this.turnState === "listening") {
            this.ws.send(buffer);
          }
        },
        realtimePcmRms(buffer) {
          const pcm = new Int16Array(buffer);
          if (!pcm.length) return 0;
          let total = 0;
          for (let i = 0; i < pcm.length; i += 1) {
            const value = pcm[i] / 32768;
            total += value * value;
          }
          return Math.sqrt(total / pcm.length);
        },
        bufferToBase64(buffer) {
          const bytes = new Uint8Array(buffer);
          let binary = "";
          for (let i = 0; i < bytes.length; i += 1) {
            binary += String.fromCharCode(bytes[i]);
          }
          return btoa(binary);
        },
        maybeTriggerRealtimeBargeIn(buffer) {
          if (!this.sessionActive || !this.bargeInArmed) return;
          const now = performance.now();
          const rms = this.realtimePcmRms(buffer);
          if (rms >= 0.018) {
            this.bargeInSpeechMs += 200;
          } else {
            this.bargeInSpeechMs = Math.max(0, this.bargeInSpeechMs - 120);
          }
          if (this.bargeInSpeechMs >= 360 && now - this.bargeInLastAt > 900) {
            this.bargeInLastAt = now;
            this.bargeInSpeechMs = 0;
            this.bargeInArmed = false;
            this.playbackGeneration += 1;
            stopCurrentAiPlaybackForBargeIn();
            this.turnState = "listening";
            state.realtimeTurnState = "listening";
            state.isTyping = false;
            state.isListening = true;
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
              this.ws.send(JSON.stringify({ type: "barge_in", audio: this.bufferToBase64(buffer) }));
            }
            render();
            postLive2D({ listen: true });
          }
        },
        async stop() {
          this.playbackGeneration += 1;
          if (this.ws && this.ws.readyState === WebSocket.OPEN && this.started) {
            this.ws.send(JSON.stringify({ type: "end_session" }));
          }
          this.started = false;
          this.sessionActive = false;
          this.turnState = "idle";
          state.isListening = false;
          state.isTyping = false;
          state.isSpeaking = hasActiveSpeechPlayback();
          state.voiceMode = "";
          state.realtimeSessionActive = false;
          state.realtimeTurnState = "";
          postLive2D({ listen: false });
          this.stopCapture();
          this.cleanup(true);
          render();
        },
        interrupt() {
          this.playbackGeneration += 1;
          if (this.ws && this.ws.readyState === WebSocket.OPEN) {
            this.ws.send(JSON.stringify({ type: "interrupt" }));
          }
          this.cleanup(true);
        },
        stopCapture() {
          if (this.workletNode) {
            try { this.workletNode.disconnect(); } catch (e) {}
            this.workletNode.port.onmessage = null;
            this.workletNode = null;
          }
          if (this.processorNode) {
            try { this.processorNode.disconnect(); } catch (e) {}
            this.processorNode.onaudioprocess = null;
            this.processorNode = null;
          }
          if (this.sourceNode) {
            try { this.sourceNode.disconnect(); } catch (e) {}
            this.sourceNode = null;
          }
          if (this.silentGain) {
            try { this.silentGain.disconnect(); } catch (e) {}
            this.silentGain = null;
          }
          if (this.stream) {
            this.stream.getTracks().forEach(track => track.stop());
            this.stream = null;
          }
          this.pendingLength = 0;
        },
        cleanup(closeSocket) {
          this.stopCapture();
          if (this.audioContext) {
            try { this.audioContext.close(); } catch (e) {}
            this.audioContext = null;
          }
          if (closeSocket && this.ws) {
            try { this.ws.close(); } catch (e) {}
          }
          this.ws = null;
          this.connected = false;
          this.started = false;
          this.sessionActive = false;
          this.turnState = "idle";
          this.bargeInArmed = false;
          this.pendingServerListening = false;
          this.playbackGeneration += 1;
          state.isListening = false;
          state.realtimeSessionActive = false;
          state.realtimeTurnState = "";
          if (state.voiceMode === "realtime") state.voiceMode = "";
          postLive2D({ listen: false });
          render();
        },
        handleMessage(event) {
          let data;
          try { data = JSON.parse(event.data); } catch (e) { return; }
          if (data.type === "ready") {
            this.realtimeStatus = data.status || null;
            this.speechRmsThreshold = Number(this.realtimeStatus && this.realtimeStatus.asr && this.realtimeStatus.asr.speech_rms_threshold) || 0;
            const status = $("voiceStatusText");
            if (status && this.realtimeStatus && this.realtimeStatus.asr && this.realtimeStatus.asr.warming) {
              status.textContent = "实时语音模型预热中，首次识别会稍慢";
            }
            return;
          }
          if (data.type === "listening") {
            if (!this.sessionActive) return;
            this.speechRmsThreshold = Number(data.speech_rms_threshold || this.speechRmsThreshold || 0);
            if (this.turnState === "speaking") {
              this.pendingServerListening = true;
              return;
            }
            this.turnState = "listening";
            this.pendingServerListening = false;
            this.bargeInArmed = false;
            state.realtimeSessionActive = true;
            state.realtimeTurnState = "listening";
            state.isListening = true;
            state.isTyping = false;
            const status = $("voiceStatusText");
            if (status) status.textContent = "继续说话，我在听。请用正常音量说话";
            postLive2D({ listen: true });
            render();
            return;
          }
          if (data.type === "asr_partial") {
            state.realtimeTranscript = data.text || "";
            const status = $("voiceStatusText");
            if (status) status.textContent = "识别中：" + state.realtimeTranscript;
            return;
          }
          if (data.type === "speech_end") {
            if (!this.sessionActive) return;
            this.turnState = "finalizing";
            state.realtimeTurnState = "finalizing";
            state.isListening = false;
            state.isTyping = true;
            const status = $("voiceStatusText");
            if (status) status.textContent = data.reason === "silence" ? "已检测到停顿，正在识别最终文本..." : "正在识别最终文本...";
            postLive2D({ listen: false });
            render();
            return;
          }
          if (data.type === "asr_final") {
            if (!this.sessionActive) return;
            const query = data.text || "";
            state.realtimeTranscript = query;
            state.lastVoiceQuery = query;
            this.lastVoiceQuery = query;
            if (query) state.messages.push({ role: "user", content: query });
            this.answerIndex = state.messages.push({ role: "assistant", content: "" }) - 1;
            state.realtimeAnswer = "";
            state.isListening = false;
            state.isTyping = true;
            this.turnState = "answering";
            this.bargeInArmed = true;
            state.realtimeTurnState = "answering";
            postLive2D({ listen: false });
            render();
            return;
          }
          if (data.type === "llm_delta") {
            state.realtimeAnswer += data.text || "";
            if (this.answerIndex >= 0 && state.messages[this.answerIndex]) {
              state.messages[this.answerIndex].content = state.realtimeAnswer;
            }
            render();
            return;
          }
          if (data.type === "tts_start") {
            data.query = data.query || this.lastVoiceQuery || state.realtimeTranscript;
            state.isSpeaking = true;
            this.turnState = "speaking";
            this.bargeInArmed = true;
            state.realtimeTurnState = "speaking";
            applyAssistantMeta(data);
            postLive2D({ speak: true, text: data.text || "", emotion: state.currentEmotion });
            render();
            return;
          }
          if (data.type === "audio_chunk" && data.audio_url) {
            data.query = data.query || this.lastVoiceQuery || state.realtimeTranscript;
            if (data.emotion) applyAssistantMeta(data);
            const generation = this.playbackGeneration;
            this.audioQueue = this.audioQueue.then(() => {
              if (!this.sessionActive || generation !== this.playbackGeneration) return;
              return playRealtimeAudio(data.audio_url, data.text || "", data.tts && data.tts.subtitles);
            });
            return;
          }
          if (data.type === "done") {
            data.query = data.query || this.lastVoiceQuery || state.realtimeTranscript;
            if (this.answerIndex >= 0 && state.messages[this.answerIndex]) {
              if (data.answer && !state.messages[this.answerIndex].content) {
                state.messages[this.answerIndex].content = data.answer;
              }
              state.messages[this.answerIndex].meta = responseMeta(data);
            }
            applyAssistantMeta(data);
            state.isTyping = false;
            state.isListening = this.sessionActive && data.continue_listening !== false;
            state.isSpeaking = false;
            if (this.sessionActive && data.continue_listening !== false) {
              this.turnState = "speaking";
              this.bargeInArmed = true;
              this.pendingServerListening = true;
              state.realtimeSessionActive = true;
              state.realtimeTurnState = "speaking";
              postLive2D({ listen: false });
              const status = $("voiceStatusText");
              if (status) status.textContent = "AI 正在播报，可直接打断";
              const resumeAfterAudio = () => this.resumeRealtimeListeningAfterAudio();
              this.audioQueue = this.audioQueue.then(resumeAfterAudio, resumeAfterAudio);
            } else {
              postLive2D({ listen: false });
              this.cleanup(true);
            }
            render();
            return;
          }
          if (data.type === "turn_cancelled") {
            this.playbackGeneration += 1;
            this.turnState = "listening";
            this.pendingServerListening = false;
            this.bargeInArmed = false;
            state.isTyping = false;
            state.isSpeaking = false;
            state.isListening = true;
            state.realtimeSessionActive = true;
            state.realtimeTurnState = "listening";
            const status = $("voiceStatusText");
            if (status) status.textContent = "已打断，继续说话，我在听。请用正常音量说话";
            postLive2D({ listen: true });
            render();
            return;
          }
          if (data.type === "interrupted") {
            this.cleanup(true);
            return;
          }
          if (data.type === "error") {
            const msg = "实时语音失败：" + (data.error || "未知错误");
            if (!state.messages.length || state.messages[state.messages.length - 1].content !== msg) {
              state.messages.push({ role: "assistant", content: msg });
            }
            state.isTyping = false;
            state.isSpeaking = false;
            this.cleanup(true);
            render();
          }
        },
        resumeRealtimeListeningAfterAudio() {
          if (!this.sessionActive) return;
          if (this.turnState === "speaking" && this.pendingServerListening) {
            this.pendingServerListening = false;
          }
          this.turnState = "listening";
          this.bargeInArmed = false;
          state.isListening = true;
          state.isSpeaking = false;
          state.isTyping = false;
          state.realtimeSessionActive = true;
          state.realtimeTurnState = "listening";
          const status = $("voiceStatusText");
          if (status) status.textContent = "继续说话，我在听。请用正常音量说话";
          postLive2D({ listen: true });
          render();
        }
      };
    }

    function startLipSyncForAudio(audio) {
      stopLipSync();
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        postLive2D({ speak: true, emotion: state.currentEmotion });
        return;
      }
      try {
        lipSync.ctx = lipSync.ctx || new AudioCtx();
        lipSync.analyser = lipSync.ctx.createAnalyser();
        lipSync.analyser.fftSize = 256;
        lipSync.source = lipSync.ctx.createMediaElementSource(audio);
        lipSync.source.connect(lipSync.analyser);
        lipSync.analyser.connect(lipSync.ctx.destination);
        const data = new Uint8Array(lipSync.analyser.frequencyBinCount);
        const tick = () => {
          if (!lipSync.analyser) return;
          lipSync.analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i += 1) sum += data[i];
          const mouth = Math.min(1, Math.max(0.04, (sum / data.length) / 92));
          postLive2D({ mouth, speak: true, emotion: state.currentEmotion });
          lipSync.raf = requestAnimationFrame(tick);
        };
        tick();
      } catch (e) {
        postLive2D({ speak: true, emotion: state.currentEmotion });
      }
    }

    function stopLipSync() {
      if (lipSync.raf) cancelAnimationFrame(lipSync.raf);
      lipSync.raf = 0;
      if (lipSync.source) {
        try { lipSync.source.disconnect(); } catch (e) {}
        lipSync.source = null;
      }
      if (lipSync.analyser) {
        try { lipSync.analyser.disconnect(); } catch (e) {}
        lipSync.analyser = null;
      }
      postLive2D({ mouth: 0, speak: false });
    }

    function setLive2DSubtitle(text) {
      state.live2dSubtitle = String(text || "").trim();
      const el = $("live2dSubtitle");
      if (!el) return;
      el.textContent = state.live2dSubtitle;
      el.classList.toggle("visible", !!state.live2dSubtitle);
    }

    function clearLive2DSubtitle() {
      state.live2dSubtitle = "";
      const el = $("live2dSubtitle");
      if (!el) return;
      el.textContent = "";
      el.classList.remove("visible");
    }

    function normalizeSubtitles(subtitles) {
      if (!Array.isArray(subtitles)) return [];
      return subtitles.map(item => ({
        start_s: Number(item.start_s ?? item.start ?? 0) || 0,
        end_s: Number(item.end_s ?? item.end ?? 0) || 0,
        text: String(item.text || "").trim()
      })).filter(item => item.text);
    }

    function chineseNumberForSpeech(value, useLiang) {
      const number = Number(value);
      const digits = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
      if (!Number.isFinite(number)) return String(value || "");
      if (number === 0) return "零";
      if (useLiang && number === 2) return "两";
      if (number < 10) return digits[number];
      if (number < 20) return "十" + (number % 10 ? digits[number % 10] : "");
      if (number < 100) return digits[Math.floor(number / 10)] + "十" + (number % 10 ? digits[number % 10] : "");
      if (number < 1000) {
        const hundreds = Math.floor(number / 100);
        const rest = number % 100;
        let text = digits[hundreds] + "百";
        if (!rest) return text;
        if (rest < 10) return text + "零" + digits[rest];
        if (rest < 20) return text + "一" + chineseNumberForSpeech(rest, false);
        return text + chineseNumberForSpeech(rest, false);
      }
      return String(value);
    }

    function timeToSpeech(hour, minute) {
      const minutes = Number(minute);
      let text = chineseNumberForSpeech(Number(hour), false) + "点";
      if (minutes === 0) return text;
      if (minutes === 30) return text + "半";
      return text + (minutes < 10 ? "零" : "") + chineseNumberForSpeech(minutes, false) + "分";
    }

    function decimalNumberToSpeech(integer, fraction) {
      const decimalText = String(fraction || "").split("").map(digit => chineseNumberForSpeech(Number(digit), false)).join("");
      return chineseNumberForSpeech(Number(integer), false) + "点" + decimalText;
    }

    function normalizeTimeForSpeech(text) {
      return String(text || "")
        .replace(/(^|[^\d])(\d{1,3})\.(\d+)(?!\d)/g, (_, prefix, integer, fraction) => (
          prefix + decimalNumberToSpeech(integer, fraction)
        ))
        .replace(/(\d{1,2}):(\d{2})\s*[-~—－至到]\s*(\d{1,2}):(\d{2})/g, (_, h1, m1, h2, m2) => (
          timeToSpeech(h1, m1) + "到" + timeToSpeech(h2, m2)
        ))
        .replace(/(\d{1,2}):(\d{2})/g, (_, hour, minute) => timeToSpeech(hour, minute))
        .replace(/(\d{1,2})\s*[-~—－至到]\s*(\d{1,2})\s*(分钟|分)/g, (_, start, end, unit) => (
          chineseNumberForSpeech(Number(start), false) + "到" + chineseNumberForSpeech(Number(end), false) + unit
        ))
        .replace(/(^|[^\d])(\d{1,2})\s*(分钟|分)/g, (_, prefix, number, unit) => (
          prefix + chineseNumberForSpeech(Number(number), false) + unit
        ))
        .replace(/(^|[^\d])(\d{1,2})\s*(小时|个小时)/g, (_, prefix, number, unit) => (
          prefix + chineseNumberForSpeech(Number(number), true) + unit
        ))
        .replace(/(^|[^\dA-Za-z])(\d{1,3})(?![\dA-Za-z])/g, (_, prefix, number) => (
          prefix + chineseNumberForSpeech(Number(number), false)
        ));
    }

    function normalizePolyphonicChineseForSpeech(text) {
      const replacements = [
        ["汉藏", "汉臧"],
        ["藏传", "臧传"],
        ["藏式", "臧式"],
        ["藏香", "臧香"],
        ["藏族", "臧族"],
        ["藏文", "臧文"],
        ["藏语", "臧语"],
        ["藏历", "臧历"],
        ["藏地", "臧地"],
        ["藏区", "臧区"],
        ["藏文化", "臧文化"],
        ["藏传坛城", "臧传坛城"]
      ];
      const normalized = replacements.reduce((value, pair) => value.split(pair[0]).join(pair[1]), String(text || ""));
      return normalized
        .replace(/同行(?=有|的|人|游客|老人|孩子|小孩|家人|朋友|的话|时|就|可以|不必|，|。|；|、)/g, "同游")
        .replace(/(?<=[老小孩友人客])同行/g, "同游")
        .replace(/全长(?=(?:约为|约|为|达|大约|近|将近|超过)?[零〇一二两三四五六七八九十百千万点\d]+\s*(?:米|公里|千米|厘米|毫米|m|km|cm|mm))/gi, "总长度")
        .replace(/桥身长(?=(?:约为|约|为|达|大约|近|将近|超过)?[零〇一二两三四五六七八九十百千万点\d]+\s*(?:米|公里|千米|厘米|毫米|m|km|cm|mm))/gi, "桥身长度")
        .replace(/桥的桥长/g, "桥的长度")
        .replace(/桥长(?=，|。|；|、|和|与|而|不|是|约|有|为|在|$)/g, "桥的长度")
        .replace(/长/g, "常");
    }

    function stripStageDirectionsForSpeech(text) {
      const actionWords = "微微|语气|笑|欠身|点头|摇头|挥手|停顿|温和|庄重|轻声|认真|调皮|开心|惊讶|疑惑|表情|动作|看向|眨眼|鞠躬|合掌|手势|俏皮|害羞|低头|抬头|沉思";
      const actionRe = new RegExp(actionWords);
      return String(text || "").replace(/（([^（）]{0,80})）|\(([^()]{0,80})\)/g, (match, cn, en, offset, whole) => {
        const content = cn || en || "";
        const isLeading = !whole.slice(0, offset).trim();
        if ((isLeading && content.length <= 60) || actionRe.test(content)) return "";
        return match;
      });
    }

    function prepareSpeechText(text) {
      const value = normalizePolyphonicChineseForSpeech(normalizeTimeForSpeech(stripStageDirectionsForSpeech(text)))
        .replace(/[*#>`_~]/g, "")
        .replace(/\s+/g, " ")
        .trim();
      return value;
    }

    function startSubtitleSync(audio, text, subtitles) {
      const segments = normalizeSubtitles(subtitles);
      if (!segments.length) {
        setLive2DSubtitle(text);
        return;
      }
      setLive2DSubtitle(segments[0].text || text);
      audio.addEventListener("timeupdate", () => {
        const now = audio.currentTime || 0;
        const active = segments.find(item => now >= item.start_s && (!item.end_s || now <= item.end_s));
        setLive2DSubtitle(active ? active.text : (segments[segments.length - 1].text || text));
      });
    }

    function playRealtimeAudio(audioUrl, text, subtitles) {
      return new Promise((resolve) => {
        const audio = new Audio(audioUrl + "?t=" + Date.now());
        let settled = false;
        const finishRealtimePlayback = () => {
          if (settled) return;
          settled = true;
          if (state.currentAudio === audio) state.currentAudio = null;
          state.isSpeaking = false;
          stopLipSync();
          clearLive2DSubtitle();
          render();
          resolve();
        };
        audio._finishRealtimePlayback = finishRealtimePlayback;
        state.currentAudio = audio;
        audio.onplay = () => {
          state.isSpeaking = true;
          postLive2D({ speak: true, text, emotion: state.currentEmotion });
          startSubtitleSync(audio, text, subtitles);
          startLipSyncForAudio(audio);
          render();
        };
        audio.onended = audio.onerror = () => finishRealtimePlayback();
        audio.play().catch(() => {
          finishRealtimePlayback();
        });
      });
    }

    function splitSpeechText(text) {
      const raw = prepareSpeechText(text)
        .replace(/\*\*/g, "")
        .replace(/[#>`*_~-]/g, "");
      const pieces = raw
        .split(/(?<=[。！？!?；;：:])\s*|\n+/)
        .map(s => s.trim())
        .filter(Boolean);
      const result = [];
      for (const piece of pieces) {
        if (piece.length <= 90) {
          result.push(piece);
          continue;
        }
        result.push(...splitLongSpeechPiece(piece, 90));
      }
      return result;
    }

    function splitLongSpeechPiece(piece, maxChars) {
      const value = String(piece || "").trim();
      if (!value) return [];
      const chunks = [];
      let start = 0;
      while (start < value.length) {
        let end = Math.min(value.length, start + maxChars);
        if (end < value.length) {
          const slice = value.slice(start, end);
          end = start + naturalSpeechSplitIndex(slice, maxChars);
          if (end <= start) end = Math.min(value.length, start + maxChars);
        }
        const chunk = value.slice(start, end).trim();
        if (chunk) chunks.push(closeSpeechClause(chunk));
        start = end;
      }
      return chunks;
    }

    function naturalSpeechSplitIndex(value, maxChars) {
      const minChars = Math.max(24, Math.floor(maxChars / 3));
      const marks = "。！？!?；;：:，,";
      let best = 0;
      let bestScore = Number.POSITIVE_INFINITY;
      for (let i = 0; i < value.length; i += 1) {
        if (!marks.includes(value[i])) continue;
        const splitAt = i + 1;
        if (splitAt < minChars || splitAt > maxChars) continue;
        if (value.slice(0, splitAt).endsWith("、")) continue;
        const strongPenalty = "。！？!?；;".includes(value[i]) ? 0 : 8;
        const score = strongPenalty + Math.abs(splitAt - Math.floor(maxChars * 0.72));
        if (score < bestScore) {
          bestScore = score;
          best = splitAt;
        }
      }
      if (best) return best;
      let fallback = Math.min(maxChars, value.length);
      while (fallback > minChars && "、，,：:".includes(value[fallback - 1])) fallback -= 1;
      return fallback;
    }

    function closeSpeechClause(text) {
      const value = String(text || "").trim();
      if (!value) return value;
      return /[，,、：:]$/.test(value) ? value.slice(0, -1).trim() + "。" : value;
    }

    async function speak(text) {
      stopSpeech();
      const sentences = splitSpeechText(text);
      if (!sentences.length) return;
      const session = {
        id: ++speechSessionId,
        cancelled: false,
        sentences,
        nextToPlay: 0,
        cache: new Map(),
        requests: new Map()
      };
      activeSpeechSession = session;
      state.isSpeaking = true;
      render();
      runOpenSourceSpeechSession(session).catch((e) => {
        if (!session.cancelled) {
          console.warn("Open-source sentence TTS unavailable.", e);
          activeSpeechSession = null;
          state.isSpeaking = false;
          stopLipSync();
          clearLive2DSubtitle();
          postLive2D({ speak: false });
          if (normalizeVoiceProvider(state.config.voice_provider) === "gpt_sovits") {
            const msg = "GSV-TTS-Lite 克隆音色合成失败：" + (e.message || "请检查 GSV-TTS-Lite 服务、克隆音频和参考文本。");
            state.messages.push({ role: "assistant", content: msg });
            render();
            return;
          }
          speakWithBrowser(text);
        }
      });
    }

    async function speakNarration(data) {
      stopSpeech();
      const sentences = Array.isArray(data && data.segments) && data.segments.length
        ? data.segments.map(s => String(s || "").trim()).filter(Boolean)
        : splitSpeechText(data && data.answer);
      if (!sentences.length) return;
      const session = {
        id: ++speechSessionId,
        cancelled: false,
        sentences,
        nextToPlay: 0,
        cache: new Map(),
        requests: new Map(),
        narration: true,
        startedAt: performance.now(),
        firstAudioMs: 0
      };
      activeSpeechSession = session;
      state.isSpeaking = true;
      state.narrationSpeechStatus = "第 1 段语音生成中";
      render();
      runOpenSourceSpeechSession(session).catch((e) => {
        if (!session.cancelled) {
          console.warn("Narration sentence TTS unavailable.", e);
          activeSpeechSession = null;
          state.isSpeaking = false;
          state.narrationSpeechStatus = "";
          stopLipSync();
          clearLive2DSubtitle();
          postLive2D({ speak: false });
          if (normalizeVoiceProvider(state.config.voice_provider) === "gpt_sovits" && (state.config.voice_clone_id || "").trim()) {
            const msg = "景点讲解克隆音色合成失败：" + (e.message || "请检查 GSV-TTS-Lite 服务、克隆音频和参考文本。");
            state.messages.push({ role: "assistant", content: msg });
            render();
            return;
          }
          speakWithBrowser(data && data.answer);
        }
      });
    }

    function synthesizeSentence(session, index) {
      if (session.cancelled || index >= session.sentences.length) return null;
      if (session.cache.has(index)) return Promise.resolve(session.cache.get(index));
      if (session.requests.has(index)) return session.requests.get(index);
      const payload = session.narration && index === 0
        ? { text: session.sentences[index], purpose: "narration_first", fast_first: true }
        : { text: session.sentences[index] };
      const request = apiPost("/api/tts/synthesize", payload)
        .then((speech) => {
          if (!speech.audio_url) throw new Error(speech.error || "TTS did not return audio.");
          session.cache.set(index, speech);
          session.requests.delete(index);
          return speech;
        })
        .catch((e) => {
          session.requests.delete(index);
          throw e;
        });
      session.requests.set(index, request);
      return request;
    }

    async function runOpenSourceSpeechSession(session) {
      synthesizeSentence(session, 0);
      synthesizeSentence(session, 1);
      while (!session.cancelled && session.nextToPlay < session.sentences.length) {
        const index = session.nextToPlay;
        if (session.narration) {
          state.narrationSpeechStatus = index === 0 ? "第 1 段语音生成中" : "后续讲解准备中";
          render();
        }
        const speech = await synthesizeSentence(session, index);
        if (session.cancelled) return;
        synthesizeSentence(session, index + 1);
        if (session.narration) {
          if (index === 0 && !session.firstAudioMs) {
            session.firstAudioMs = Math.round(performance.now() - session.startedAt);
          }
          state.narrationSpeechStatus = "正在播放第 " + (index + 1) + " 段";
          render();
        }
        await playAudioSpeechQueued(speech.audio_url, session.sentences[index], session, speech.subtitles);
        session.nextToPlay += 1;
      }
      if (!session.cancelled && activeSpeechSession === session) {
        activeSpeechSession = null;
        state.isSpeaking = false;
        state.narrationSpeechStatus = "";
        stopLipSync();
        clearLive2DSubtitle();
        postLive2D({ speak: false });
        render();
      }
    }

    function stopSpeech() {
      if (realtimeClient && realtimeClient.connected) {
        realtimeClient.interrupt();
        realtimeClient = null;
      }
      if (state.currentAudio) {
        if (typeof state.currentAudio._finishRealtimePlayback === "function") {
          state.currentAudio._finishRealtimePlayback();
        }
        state.currentAudio.onplay = null;
        state.currentAudio.onended = null;
        state.currentAudio.onerror = null;
        state.currentAudio.pause();
        try { state.currentAudio.currentTime = 0; } catch (e) {}
        state.currentAudio = null;
      }
      if (activeSpeechSession) {
        activeSpeechSession.cancelled = true;
        activeSpeechSession = null;
      }
      speechQueue = [];
      currentUtterance = null;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      state.isSpeaking = false;
      state.narrationSpeechStatus = "";
      stopLipSync();
      clearLive2DSubtitle();
      postLive2D({ speak: false });
      render();
    }

    function stopCurrentAiPlaybackForBargeIn() {
      if (state.currentAudio) {
        if (typeof state.currentAudio._finishRealtimePlayback === "function") {
          state.currentAudio._finishRealtimePlayback();
        }
        state.currentAudio.onplay = null;
        state.currentAudio.onended = null;
        state.currentAudio.onerror = null;
        state.currentAudio.pause();
        try { state.currentAudio.currentTime = 0; } catch (e) {}
        state.currentAudio = null;
      }
      if (activeSpeechSession) {
        activeSpeechSession.cancelled = true;
        activeSpeechSession = null;
      }
      speechQueue = [];
      currentUtterance = null;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      state.isSpeaking = false;
      state.narrationSpeechStatus = "";
      stopLipSync();
      clearLive2DSubtitle();
      postLive2D({ speak: false });
    }

    function stopAiSpeech() {
      stopSpeech();
    }

    function playAudioSpeech(audioUrl, text, subtitles) {
      const audio = new Audio(audioUrl + "?t=" + Date.now());
      state.currentAudio = audio;
      audio.onplay = () => {
        state.isSpeaking = true;
        postLive2D({ speak: true, text, emotion: state.currentEmotion });
        startSubtitleSync(audio, text, subtitles);
        startLipSyncForAudio(audio);
        render();
      };
      audio.onended = audio.onerror = () => {
        state.isSpeaking = false;
        stopLipSync();
        clearLive2DSubtitle();
        postLive2D({ speak: false });
        state.currentAudio = null;
        render();
      };
      audio.play().catch(() => {
        if (state.currentAudio === audio) state.currentAudio = null;
        state.isSpeaking = false;
        stopLipSync();
        clearLive2DSubtitle();
        postLive2D({ speak: false });
        render();
      });
    }

    function playAudioSpeechQueued(audioUrl, text, session, subtitles) {
      return new Promise((resolve) => {
        if (session.cancelled) {
          resolve();
          return;
        }
        const audio = new Audio(audioUrl + "?t=" + Date.now());
        state.currentAudio = audio;
        audio.onplay = () => {
          if (session.cancelled) return;
          state.isSpeaking = true;
          postLive2D({ speak: true, text, emotion: state.currentEmotion });
          startSubtitleSync(audio, text, subtitles);
          startLipSyncForAudio(audio);
          render();
        };
        audio.onended = audio.onerror = () => {
          if (state.currentAudio === audio) state.currentAudio = null;
          stopLipSync();
          clearLive2DSubtitle();
          postLive2D({ speak: false });
          render();
          resolve();
        };
        audio.play().catch(() => {
          if (state.currentAudio === audio) state.currentAudio = null;
          stopLipSync();
          clearLive2DSubtitle();
          resolve();
        });
      });
    }

    function speakWithBrowser(text) {
      if (!("speechSynthesis" in window)) {
        state.isSpeaking = false;
        clearLive2DSubtitle();
        postLive2D({ speak: false });
        render();
        return;
      }
      window.speechSynthesis.cancel();
      speechQueue = splitSpeechText(text);
      state.isSpeaking = speechQueue.length > 0;
      if (!speechQueue.length) return;
      speakNextSentence();
    }

    async function refreshTtsHint() {
      try {
        const data = await apiGet("/api/tts/status");
        if (data.provider_ready || data.ok) {
          const provider = normalizeVoiceProvider(data.provider) === "gpt_sovits" ? "GSV-TTS-Lite" : "Edge-TTS";
          $("ttsHint").textContent = "语音：" + provider + " 可用";
        } else if (data.fallback_available) {

    function speakNextSentence() {
      if (!speechQueue.length) {
        state.isSpeaking = false;
        clearLive2DSubtitle();
        postLive2D({ speak: false });
        render();
        return;
      }
      const sentence = speechQueue.shift();
      const utter = new SpeechSynthesisUtterance(sentence);
      currentUtterance = utter;
      utter.lang = "zh-CN";
      utter.rate = 1;
      utter.pitch = 1;
      utter.onstart = () => {
        state.isSpeaking = true;
        setLive2DSubtitle(sentence);
        postLive2D({ speak: true, text: sentence, emotion: state.currentEmotion });
        render();
      };
      utter.onend = () => {
        clearLive2DSubtitle();
        postLive2D({ speak: false });
        setTimeout(speakNextSentence, 80);
      };
      utter.onerror = () => {
        clearLive2DSubtitle();
        postLive2D({ speak: false });
        setTimeout(speakNextSentence, 80);
      };
      window.speechSynthesis.speak(utter);
    }

    async function sendVoiceBlob(blob) {
      const form = new FormData();
      form.append("audio", blob, "voice.webm");
      form.append("interest", state.interest || "");
      form.append("history", JSON.stringify(state.messages.slice(-10).map(m => ({ role: m.role, content: m.content }))));
      state.voiceBusy = true;
      state.isTyping = true;
      render();
      try {
        const data = await apiFormPost("/api/voice/realtime", form);
        const query = data.query || "";
        const answer = data.answer || "抱歉，我暂时没有整理出答案。";
        if (query) state.messages.push({ role: "user", content: query });
        applyAssistantMeta(data);
        state.messages.push({ role: "assistant", content: answer, meta: responseMeta(data) });
        if (data.audio_url) playAudioSpeech(data.audio_url, answer, data.tts && data.tts.subtitles);
        else speak(answer);
      } catch (e) {
        const fallback = "语音识别暂时不可用：" + (e.message || "请检查 SenseVoice / edge-tts 依赖。");
        state.messages.push({ role: "assistant", content: fallback });

      }

      if (state.voiceStopTimer) {
        clearTimeout(state.voiceStopTimer);

        try { state.mediaRecorder.stop(); } catch (e) {}

    async function startLegacyRecording() {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        throw new Error("当前浏览器不支持录音采集。");
      }
      stopSpeech();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : (MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "");
      const rec = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      state.audioChunks = [];
      state.mediaStream = stream;
      state.mediaRecorder = rec;
      state.voiceMode = "legacy";
      rec.ondataavailable = (event) => {
        if (event.data && event.data.size) state.audioChunks.push(event.data);
      };
      rec.onstart = () => {
        state.isListening = true;
        state.voiceBusy = false;
        render();
        postLive2D({ listen: true });
      };
      rec.onerror = () => {
        state.isListening = false;
        state.voiceBusy = false;
        state.voiceMode = "";
        postLive2D({ listen: false });
        render();
      };
      rec.onstop = () => {
        if (state.voiceStopTimer) {
          clearTimeout(state.voiceStopTimer);
          state.voiceStopTimer = 0;
        }
        stream.getTracks().forEach(track => track.stop());
        state.mediaStream = null;
        state.mediaRecorder = null;
        state.isListening = false;
        state.voiceMode = "";
        postLive2D({ listen: false });
        const blob = new Blob(state.audioChunks, { type: mimeType || "audio/webm" });
        state.audioChunks = [];
        render();
        if (blob.size > 500) sendVoiceBlob(blob);
      };
      rec.start(250);
      state.voiceStopTimer = setTimeout(() => stopLegacyRecording(), 15000);
    }

    async function toggleVoice() {
      if (state.voiceBusy) return;
      if (state.mediaRecorder && state.isListening) {
        stopLegacyRecording();
        return;
      }
      if (realtimeClient && realtimeClient.connected && realtimeClient.sessionActive) {
        await stopRealtimeConversation();
        return;
      }
      if (realtimeClient && realtimeClient.connected) {
        realtimeClient.interrupt();
        realtimeClient = null;
        return;
      }
      const realtimeReady = await realtimeVoiceReady();
      if (realtimeReady) {
        try {
          await startRealtimeConversation();
          return;
        } catch (e) {
          console.warn("Realtime voice failed.", e);
          if (realtimeClient) {
            try { realtimeClient.cleanup(true); } catch (cleanupError) {}
            realtimeClient = null;
          }
          try {
            await startLegacyRecording();
            const status = $("voiceStatusText");
            if (status) status.textContent = "实时语音启动失败，已切换到普通录音模式。";
            return;
          } catch (legacyError) {
            alert("实时语音启动失败，普通录音也不可用：" + (legacyError.message || e.message || "请检查麦克风权限或刷新页面重试。"));
            return;
          }
        }
      }
      try {
        await startLegacyRecording();
        return;
      } catch (e) {
        console.warn("MediaRecorder unavailable, fallback to Web Speech API.", e);
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("当前浏览器不支持语音识别，建议使用 Chrome。");
        return;
      }
      if (state.recognition && state.isListening) {
        state.recognition.stop();
        state.isListening = false;
        render();
        return;
      }
      const rec = new SpeechRecognition();
      state.recognition = rec;
      rec.lang = "zh-CN";
      rec.interimResults = false;
      rec.continuous = false;
      rec.onstart = () => { state.isListening = true; render(); postLive2D({ listen: true }); };
      rec.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        state.isListening = false;
        state.voiceBusy = true;
        render();
        try {
          const corrected = await correctVoiceTranscript(transcript);
          state.voiceBusy = false;
          await sendMessage(corrected.text, { displayText: corrected.text });
        } catch (e) {
          state.voiceBusy = false;
          state.voiceCorrectionNotice = "语音纠错失败，请重试：" + (e.message || "请重试");
          render();
        }
      };
      rec.onerror = rec.onend = () => { state.isListening = false; if (!state.voiceBusy) render(); postLive2D({ listen: false }); };
      rec.start();
    }

    function withPreservedAdminScroll(work) {

    async function pollEvaluationProgress(jobId, mode) {
      const selectedMode = mode === "local" ? "local" : "deepseek";
      try {
        const data = await evaluationFetchWithTimeout("/api/admin/evaluation/progress?job_id=" + encodeURIComponent(jobId) + "&mode=" + encodeURIComponent(selectedMode), {
          headers: authHeaders()
        }, evaluationProgressRequestTimeoutMs, "评测进度请求超时，请确认后端服务正常后重试。");
        const progress = data.progress || data || {};
        if (progress.status === "not_found" && state.evaluationBusy === selectedMode) {
          const misses = ((state.evaluationPollMisses || {})[selectedMode] || 0) + 1;
          state.evaluationPollMisses = Object.assign({}, state.evaluationPollMisses || {}, { [selectedMode]: misses });
          if (misses <= 20) {
            setEvaluationProgress(selectedMode, {
              status: "running",
              total: 100,
              completed: 0,
              percent: 0,
              current_case_id: "",
              current_question: "后台评测任务创建中，正在继续连接进度",
              message: "启动响应较慢，正在继续追踪后台任务",
              error: ""
            });
            refreshEvaluationProgressView(selectedMode);
            clearEvaluationPoll(selectedMode);
            state.evaluationPollTimers[selectedMode] = setTimeout(() => pollEvaluationProgress(jobId, selectedMode), 1000);
            return;
          }
        }
        state.evaluationPollMisses = Object.assign({}, state.evaluationPollMisses || {}, { [selectedMode]: 0 });
        if (progress.job_id) {
          state.evaluationJobIds = Object.assign({}, state.evaluationJobIds || {}, { [selectedMode]: progress.job_id });
        }
        setEvaluationProgress(selectedMode, progress);
        if (progress.status === "queued" || progress.status === "running" || progress.status === "reviewing" || progress.status === "cancelling") {
          refreshEvaluationProgressView(selectedMode);
          clearEvaluationPoll(selectedMode);
          state.evaluationPollTimers[selectedMode] = setTimeout(() => pollEvaluationProgress(jobId, selectedMode), 1000);
          return;
        }
        clearEvaluationPoll(selectedMode);
        if (state.evaluationBusy === selectedMode) state.evaluationBusy = "";
        if (state.evaluationCancelBusy === selectedMode) state.evaluationCancelBusy = "";
        if (progress.status === "completed" || progress.status === "failed" || progress.status === "cancelled") {
          state.evaluationJobIds = Object.assign({}, state.evaluationJobIds || {}, { [selectedMode]: "" });
        }
        if (progress.status === "completed" && progress.evaluation) {
          state.evaluations = Object.assign({}, state.evaluations, {
            [selectedMode]: progress.evaluation
          });
          try {
            state.analytics = await apiGet("/api/analytics");
          } catch (analyticsError) {
            console.warn("评测完成，但运营分析刷新失败。", analyticsError);
          }
        }
        renderPreservingAdminScroll();
      } catch (e) {
        clearEvaluationPoll(selectedMode);
        if (state.evaluationBusy === selectedMode) state.evaluationBusy = "";
        if (state.evaluationCancelBusy === selectedMode) state.evaluationCancelBusy = "";
        state.evaluationJobIds = Object.assign({}, state.evaluationJobIds || {}, { [selectedMode]: "" });
        setEvaluationProgress(selectedMode, {
          status: "failed",
          total: 100,
          completed: 0,
          percent: 0,
          error: e.message || "无法读取评测进度，请检查后端服务。"
        });
        renderPreservingAdminScroll();
      }
    }

    async function runEvaluation(mode) {

      const clientJobId = createEvaluationJobId(selectedMode);
      clearEvaluationPoll(selectedMode);
      state.evaluationPollMisses = Object.assign({}, state.evaluationPollMisses || {}, { [selectedMode]: 0 });
      state.evaluationBusy = selectedMode;
      state.evaluationCancelBusy = "";

      setEvaluationProgress(selectedMode, {
        job_id: clientJobId,

        total: 100,
        completed: 0,
        percent: 0,
        current_case_id: "",
        current_question: "正在请求后端启动评测任务"
      });
      refreshEvaluationProgressView(selectedMode);
      state.evaluationPollTimers[selectedMode] = setTimeout(() => pollEvaluationProgress(clientJobId, selectedMode), 800);

        throw new Error("后端未返回评测任务编号。");

        if (e && e.isTimeout) {
          setEvaluationProgress(selectedMode, {
            job_id: clientJobId,
            status: "running",
            total: 100,
            completed: 0,
            percent: 0,
            current_case_id: "",
            current_question: "启动响应较慢，正在继续追踪后台任务",
            message: e.message || "启动响应较慢，正在继续追踪后台任务",
            error: ""
          });
          refreshEvaluationProgressView(selectedMode);
          return;
        }
        clearEvaluationPoll(selectedMode);
        state.evaluationBusy = "";
        state.evaluationCancelBusy = "";
        state.evaluationJobIds = Object.assign({}, state.evaluationJobIds || {}, { [selectedMode]: "" });
        setEvaluationProgress(selectedMode, {
          status: "failed",
          total: 100,
          completed: 0,
          percent: 0,
          error: e.message || "请检查 DeepSeek 配置或后端日志。"
        });
        renderPreservingAdminScroll();
      }
    }

        const blob = await response.blob();
        const disposition = response.headers.get("Content-Disposition") || "";

        const filename = match ? decodeURIComponent(match[1]) : `lingshan-qa-evaluation-${selectedMode}.docx`;
        const url = URL.createObjectURL(blob);

        link.download = filename;

        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert("Word 报告导出失败：" + (e.message || "请稍后重试。"));
      }
    }

    async function addKnowledge() {
      const title = $("kbTitle").value;
      const type = $("kbType").value;
      const content = $("kbContent").value;
      if (!content.trim()) {
        alert("请先填写知识内容。");
        return;
      }
      await apiPost("/api/admin/knowledge", { title, type, content });
      await loadAdminData();
    }

    async function deleteKnowledge(id) {
      await apiDelete("/api/admin/knowledge/" + encodeURIComponent(id));
      await loadAdminData();
    }

    function toggleKnowledgePreview(id) {
      state.expandedKnowledgeId = state.expandedKnowledgeId === id ? "" : id;
      render();
    }

    async function uploadKnowledgeFiles() {
      const input = $("kbFiles");
      const files = input && input.files ? Array.from(input.files) : [];
      const resultEl = $("kbUploadResult");
      if (!files.length) {
        alert("请先选择 .docx 或 .pdf 文件。");
        return;
      }
      const form = new FormData();
      files.forEach(file => form.append("files", file, file.name));
      form.append("type", $("kbFileType") ? $("kbFileType").value : "文史资料");
      form.append("title_prefix", $("kbFilePrefix") ? $("kbFilePrefix").value.trim() : "");
      if (resultEl) {
        const hasPdf = files.some(file => /\.pdf$/i.test(file.name || ""));
        const message = hasPdf ? `正在使用 PaddleOCR 解析 PDF，完成后会自动加入知识库...` : `正在解析 ${files.length} 个文件，请稍候...`;
        resultEl.innerHTML = `<div class="list-item"><p>${message}</p></div>`;
      }
      try {
        const data = await apiFormPost("/api/admin/knowledge/upload", form);
        const created = data.created || [];
        const errors = data.errors || [];
        if (resultEl) {
          resultEl.innerHTML = `
            <div class="list-item" style="border-color:#9ae6b4;background:#f0fff4">
              <strong>PDF 解析完成并已加入知识库：成功 ${created.length} 个，失败 ${errors.length} 个</strong>
              <p>下方知识库列表已刷新，可直接看到新增文档。</p>
            </div>
            ${created.map(doc => {
              const meta = doc.metadata || {};
              const ocrModel = meta.ocr_model || "";
              const pageCount = meta.page_count || meta.extracted_pages || "";
              const charCount = meta.char_count || (doc.content || "").length || 0;
              return `<div class="list-item" style="border-color:#9ae6b4;background:#f7fff9">
                <strong>已加入知识库：${escapeHtml(doc.title)}</strong>
                <p>类型：${escapeHtml(doc.type)} · 字数：${escapeHtml(String(charCount))}</p>
                ${ocrModel || pageCount ? `<p>OCR 模型：${escapeHtml(String(ocrModel || "-"))} · OCR 页数：${escapeHtml(String(pageCount || "-"))}</p>` : ""}
              </div>`;
            }).join("")}
            ${errors.map(item => `<div class="list-item"><p>${escapeHtml(item.filename)}：${escapeHtml(item.error)}</p></div>`).join("")}
          `;
        }
        if (input) input.value = "";
        state.adminPage = "knowledge";
        await loadAdminData();
      } catch (e) {
        if (resultEl) {
          resultEl.innerHTML = `<div class="list-item"><p>上传失败：${escapeHtml(e.message || "请检查文件格式和登录状态。")}</p></div>`;
        } else {
          alert("上传失败：" + (e.message || "请检查文件格式和登录状态。"));
        }
      }
    }

    async function uploadVoiceClone() {
      const fileInput = $("cloneVoiceAudio");
      const file = fileInput && fileInput.files && fileInput.files[0];
      const name = $("cloneVoiceName") ? $("cloneVoiceName").value.trim() : "";
      const prompt = $("cloneVoicePrompt") ? $("cloneVoicePrompt").value.trim() : "";
      if (!file) {
        alert("请先选择参考音频。");
        return;
      }
      if (!prompt) {
        alert("请填写参考音频中实际朗读的文本。");
        return;
      }
      const form = new FormData();
      form.append("audio", file, file.name || "reference-audio");
      form.append("name", name);
      form.append("prompt_text", prompt);
      try {
        const data = await apiFormPost("/api/admin/voice-clones", form);
        if ($("cloneVoiceName")) $("cloneVoiceName").value = "";
        if ($("cloneVoicePrompt")) $("cloneVoicePrompt").value = "";
        if (fileInput) fileInput.value = "";
        state.config.voice_provider = "gpt_sovits";
        state.config.voice_clone_id = data.voice.id;
        state.adminPage = "voiceClone";
        await loadAdminData();
        alert("克隆音色已创建。请点击试听，确认效果后保存形象配置。");
      } catch (e) {
        alert("克隆音色创建失败：" + (e.message || "请检查音频格式。"));
      }
    }

    async function useVoiceClone(id) {
      state.config.voice_provider = "gpt_sovits";
      state.config.voice_clone_id = id;
      state.avatarDraft = Object.assign({}, editableAvatarConfig(), {
        voice_provider: "gpt_sovits",
        voice_preset: "custom",
        voice_clone_id: id
      });
      render();
      setTimeout(() => {
        const provider = $("dhVoiceProvider");
        const choice = $("dhVoiceChoice");
        if (provider) provider.value = "gpt_sovits";
        if (choice) choice.value = "clone:" + id;
      }, 0);
      try {
        const data = Object.assign({}, state.config, {
          voice_provider: "gpt_sovits",
          voice_preset: "custom",
          voice_clone_id: id
        });
        state.config = await apiPost("/api/admin/config", data);
        refreshTtsHint();
      } catch (e) {
        alert("克隆音色已在页面选中，但保存到后端配置失败：" + (e.message || "请确认管理员登录状态。"));
      }
    }

    async function previewVoiceClone(id) {
      await useVoiceClone(id);
      setTimeout(previewVoice, 0);
    }

    async function deleteVoiceClone(id) {
      await apiDelete("/api/admin/voice-clones/" + encodeURIComponent(id));
      if (state.config.voice_clone_id === id) state.config.voice_clone_id = "";
      state.adminPage = "voiceClone";
      await loadAdminData();
    }

    async function saveConfig() {
      if (state.configSaving) return;
      const data = commitAvatarDraftForSave();
      state.configMutationSeq = (state.configMutationSeq || 0) + 1;
      state.configSaving = true;
      renderPreservingAdminScroll();
      try {
        state.config = await apiPost("/api/admin/config", data);
        syncAvatarPresetState(state.config, true);
        initMessages();
        render();
        setTimeout(() => postLive2D({ model: data.model }), 80);
        alert("数字人配置已保存。");
      } catch (e) {
        alert("保存失败：" + (e.message || "请确认管理员登录状态和后端服务。"));
      } finally {
        state.configMutationSeq = (state.configMutationSeq || 0) + 1;
        state.configSaving = false;
        renderPreservingAdminScroll();
      }
    }

    async function previewVoice() {
      updateAvatarDraftFromForm();
      const avatarConfig = editableAvatarConfig();
      const voiceConfig = voiceConfigFromChoice(avatarConfig.voice_provider, $("dhVoiceChoice") ? $("dhVoiceChoice").value : selectedVoiceChoiceValue(avatarConfig), avatarConfig);
      const text = "您好，我是灵山胜境数字人导游，很高兴为您讲解景区。";
      const payload = Object.assign({}, voiceConfig, {
        text,
        voice_description: $("dhVoiceDescription") ? $("dhVoiceDescription").value : (avatarConfig.voice_description || ""),
        voice_rate: $("dhVoiceRate") ? $("dhVoiceRate").value : "+0%",
        voice_pitch: $("dhVoicePitch") ? $("dhVoicePitch").value : "+0Hz",
        voice_volume: $("dhVoiceVolume") ? $("dhVoiceVolume").value : "+0%"
      });
      state.config = Object.assign({}, state.config, payload);
      state.isPreviewingVoice = true;
      stopSpeech();
      render();
      try {
        const speech = await apiPost("/api/tts/synthesize", payload);
        if (speech.audio_url) {
          if (speech.fallback_provider === "edge") {
            alert("GSV-TTS-Lite 克隆音色暂时不可用，已使用 Edge-TTS 进行试听。原因：" + (speech.gsv_tts_lite_error || speech.gpt_sovits_error || "GSV-TTS-Lite API 未就绪或合成失败。"));
          }
          playAudioSpeech(speech.audio_url, text, speech.subtitles);
          return;
        }
        const errorText = speech.error || "音色试听失败，请检查当前语音引擎配置。";
        if (/9880|WinError 10061|连接拒绝|未就绪/.test(errorText)) {
          alert(errorText + "\n\n低内存模式下 GSV-TTS-Lite 默认不常驻，请到“服务管理”页面启动 GSV-TTS-Lite 后再试听。");
          state.adminPage = "services";
          await loadAdminData();
          return;
        }
        alert(errorText);
      } catch (e) {
        const message = e.message || "请确认后端服务和当前语音引擎已就绪。";
        alert("音色试听失败：" + message + (/9880|WinError 10061|连接拒绝|未就绪/.test(message) ? "\n\n请到“服务管理”页面启动 GSV-TTS-Lite 后再试听。" : ""));
      } finally {
        state.isPreviewingVoice = false;
        render();
      }
    }

    function toggleTouristFeedbackPanel(open) {
      state.feedbackPanelOpen = typeof open === "boolean" ? open : !state.feedbackPanelOpen;
      render();
      if (state.feedbackPanelOpen && $("touristFeedbackMessage")) {
        setTimeout(() => $("touristFeedbackMessage") && $("touristFeedbackMessage").focus(), 0);
      }
    }

    async function submitFeedback() {
      const messageEl = $("touristFeedbackMessage");
      const ratingEl = $("touristFeedbackRating");
      const message = messageEl ? messageEl.value : "";
      const rating = ratingEl ? ratingEl.value : "5";
      if (!message.trim()) {
        alert("请填写反馈内容。");
        if (messageEl) messageEl.focus();
        return;
      }
      state.feedbackSubmitting = true;
      render();
      try {
        await apiPost("/api/feedback", { message, rating });
        if (messageEl) messageEl.value = "";
        if (ratingEl) ratingEl.value = "5";
        state.feedbackPanelOpen = false;
        alert("反馈已提交，感谢您的建议。");
      } catch (e) {
        alert("反馈提交失败：" + (e.message || "请稍后重试。"));
      } finally {
        state.feedbackSubmitting = false;
        render();
      }
    }

    async function bootAppData() {
      $("touristTab").onclick = () => setMode("tourist");
      $("adminTab").onclick = () => setMode("admin");
      try {
        const configPath = state.auth.user && state.auth.user.role === "admin" ? "/api/admin/config" : "/api/config";
        const [health, scenics, routes, config] = await Promise.all([
          apiGet("/api/health"),
          apiGet("/api/scenics"),
          apiGet("/api/routes"),
          apiGet(configPath)
        ]);
        $("healthText").textContent = health.deepseek_configured ? "DeepSeek 已配置" : "本地知识库模式";
        state.scenics = scenics.scenics || [];
        state.routes = routes.routes || [];
        state.config = config || {};
        syncAvatarPresetState(state.config, true);
        ensureDefaultRouteMap();
        loadMapConfig();
      } catch (e) {
        $("healthText").textContent = "后端未连接";
      }
      initMessages();
      render();
      if (state.auth.user && state.auth.user.role === "admin" && state.mode === "admin") {
        await loadAdminData();
      }
    }

    async function boot() {
      $("touristTab").onclick = () => setMode("tourist");
      $("adminTab").onclick = () => setMode("admin");
      if (!state.auth.token || !state.auth.user) {
        showLogin();
        refreshTtsHint();
        return;
      }
      try {
        const data = await apiGet("/api/auth/me");
        state.auth.user = data.user;
        localStorage.setItem("authUser", JSON.stringify(data.user));
        state.mode = preferredAppModeFromUrl() || (data.user.role === "admin" ? "admin" : "tourist");
        showApp();
        await bootAppData();
      } catch (e) {
        handleUnauthorized();
      }
      refreshTtsHint();
    }

    window.setLoginRole = setLoginRole;
    window.setAuthPanel = setAuthPanel;
    window.fillDemoLogin = fillDemoLogin;
    window.doLogin = doLogin;
    window.doRegister = doRegister;
    window.logout = logout;
    window.setInterest = setInterest;
    window.sendMessage = sendMessage;
    window.askSpot = askSpot;
    window.askRoute = askRoute;
    window.askCurrentRoute = askCurrentRoute;
    window.askNextStageSpot = askNextStageSpot;
    window.openStandaloneMap = openStandaloneMap;
    window.openOverviewPanorama = openOverviewPanorama;
    window.toggleVoice = toggleVoice;
    window.stopAiSpeech = stopAiSpeech;
    window.toggleTouristFeedbackPanel = toggleTouristFeedbackPanel;
    window.addKnowledge = addKnowledge;
    window.deleteKnowledge = deleteKnowledge;
    window.toggleKnowledgePreview = toggleKnowledgePreview;
    window.uploadKnowledgeFiles = uploadKnowledgeFiles;
    window.uploadVoiceClone = uploadVoiceClone;
    window.selectAvatarPreset = selectAvatarPreset;
    window.addAvatarPreset = addAvatarPreset;
    window.deleteAvatarPreset = deleteAvatarPreset;
    window.updateAvatarDraftFromForm = updateAvatarDraftFromForm;
    window.handleVoiceProviderChange = handleVoiceProviderChange;
    window.useVoiceClone = useVoiceClone;
    window.previewVoiceClone = previewVoiceClone;
    window.deleteVoiceClone = deleteVoiceClone;
    window.saveConfig = saveConfig;
    window.previewVoice = previewVoice;
    window.submitFeedback = submitFeedback;
    window.setAdminPage = setAdminPage;
    window.runEvaluation = runEvaluation;
    window.cancelEvaluation = cancelEvaluation;
    window.setEvaluationDetailMode = setEvaluationDetailMode;
    window.setEvaluationDetailCategory = setEvaluationDetailCategory;
    window.setEvaluationDetailStatus = setEvaluationDetailStatus;
    window.setEvaluationDetailQuery = setEvaluationDetailQuery;
    window.exportEvaluationWord = exportEvaluationWord;
    window.startManagedService = startManagedService;
    window.stopManagedService = stopManagedService;
    window.retryLoadServices = retryLoadServices;
    boot();
  </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="design-reference" content="DESIGN-apple.md Apple product stage and system workbench">
  <title>灵山胜境 AI 数字人导览服务</title>
  <style>
    :root {
      --apple-blue: #0066cc;
      --apple-blue-focus: #0071e3;
      --apple-blue-on-dark: #2997ff;
      --apple-ink: #1d1d1f;
      --apple-muted: #6e6e73;
      --apple-muted-strong: #333333;
      --apple-muted-soft: #7a7a7a;
      --apple-hairline: #e0e0e0;
      --apple-divider-soft: #f0f0f0;
      --apple-canvas: #ffffff;
      --apple-parchment: #f5f5f7;
      --apple-pearl: #fafafc;
      --apple-dark-tile: #272729;
      --apple-dark-tile-2: #2a2a2c;
      --apple-black: #000000;
      --apple-chip: rgba(210, 210, 215, .64);
      --apple-product-shadow: 3px 5px 30px rgba(0, 0, 0, .22);
      --ink: var(--apple-ink);
      --accent-ink: var(--apple-ink);
      --muted: var(--apple-muted);
      --line: var(--apple-hairline);
      --paper: var(--apple-canvas);
      --wash: var(--apple-parchment);
      --gold: var(--apple-blue);
      --gold-2: var(--apple-blue-focus);
      --green: var(--apple-blue);
      --jade-soft: var(--apple-parchment);
      --mist: var(--apple-parchment);
      --clay: var(--apple-muted-strong);
      --surface-deep: var(--apple-dark-tile);
      --surface-warm: var(--apple-parchment);
      --blue: var(--apple-blue);
      --red: #dc2626;
      --shadow: none;
      --shadow-soft: none;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: auto;
      font-family: "SF Pro Text", "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--apple-parchment);
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      background: var(--wash);
    }
    .sidebar {
      background: #243447;
      color: #eef4f8;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand {
      padding: 22px 20px 18px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: 0;
    }
    .brand p {
      margin: 8px 0 0;
      color: rgba(238,244,248,.72);
      font-size: 13px;
      line-height: 1.5;
    }
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .mode-tabs button, .quick-btn, .route-card, .spot-item, .icon-btn, .primary-btn, .secondary-btn {
      border: 0;
      border-radius: var(--radius);
    }
    .mode-tabs button {
      padding: 10px 8px;
      color: rgba(238,244,248,.82);
      background: rgba(255,255,255,.08);
    }
    .mode-tabs button.active { background: var(--gold); color: #fff; }
    .panel-scroll {
      overflow: auto;
      min-height: 0;
      padding: 14px 16px 22px;
    }
    .side-section { margin-bottom: 20px; }
    .side-title {
      margin: 0 0 10px;
      font-size: 12px;
      color: rgba(238,244,248,.66);
      font-weight: 700;
      letter-spacing: 0;
    }
    .spot-item {
      width: 100%;
      text-align: left;
      padding: 10px 11px;
      margin: 4px 0;
      background: transparent;
      color: rgba(238,244,248,.88);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .spot-item:hover, .spot-item.active { background: rgba(255,255,255,.10); }
    .spot-item small { color: rgba(238,244,248,.48); }
    .route-card {
      width: 100%;
      display: block;
      text-align: left;
      padding: 12px;
      margin: 8px 0;
      color: #f7fafc;
      background: rgba(255,255,255,.08);
    }
    .route-card:hover { background: rgba(255,255,255,.14); }
    .route-card strong { display: block; font-size: 14px; }
    .route-card span { display: block; margin-top: 4px; color: rgba(238,244,248,.62); font-size: 12px; line-height: 1.45; }
    .main {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 22px;
      background: rgba(255,255,255,.88);
      border-bottom: 1px solid var(--line);
    }
    .topbar strong { font-size: 17px; }
    .topbar span { color: var(--muted); font-size: 13px; }
    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef8f4;
      color: #17624f;
      font-size: 12px;
    }
    .status-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .workspace {
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow: hidden;
    }
    .tourist-view {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(380px, 46%) minmax(360px, 1fr);
      gap: 16px;
    }
    .stage, .chat, .admin-card, .metric-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .stage {
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .human-frame {
      position: relative;
      flex: 1;
      min-height: 360px;
      background: var(--apple-canvas);
      overflow: hidden;
    }
    .human-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
    .live2d-subtitle {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      z-index: 3;
      display: none;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(20, 28, 36, .72);
      color: #fff;
      font-size: 15px;
      line-height: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
      backdrop-filter: blur(6px);
    }
    .live2d-subtitle.visible { display: block; }
    .map-panel {
      position: relative;
      height: 236px;
      border-top: 1px solid var(--line);
      background: #f8fbfc;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }
    .map-toolbar {
      position: relative;
      z-index: 7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid rgba(217,226,236,.74);
    }
    .map-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .map-title strong { font-size: 13px; }
    .map-title span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-actions {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }
    .map-actions .tool-btn {
      padding: 6px 8px;
      font-size: 12px;
    }
    .lingshan-map {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--apple-parchment);
    }
    .weather-animation-overlay {
      position: absolute;
      left: 0;
      right: 0;
      top: 50px;
      bottom: 0;
      z-index: 6;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity .24s ease, visibility .24s ease;
      background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0));
    }
    .weather-animation-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    .weather-animation-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 9px;
      border: 1px solid rgba(255, 255, 255, .68);
      border-radius: 999px;
      background: rgba(255, 255, 255, .78);
      color: var(--apple-ink);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(29, 29, 31, .12);
      backdrop-filter: blur(10px);
    }
    .weather-sun {
      position: absolute;
      left: 15%;
      top: 16%;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 190, 72, .78);
      box-shadow: 0 0 0 18px rgba(255, 190, 72, .12), 0 0 38px rgba(255, 158, 49, .28);
      animation: weatherSunPulse 2.8s ease-in-out infinite;
    }
    .weather-cloud {
      position: absolute;
      width: 78px;
      height: 25px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 8px 18px rgba(29, 29, 31, .10);
      animation: weatherCloudDrift 6.2s ease-in-out infinite alternate;
    }
    .weather-cloud::before,
    .weather-cloud::after {
      content: "";
      position: absolute;
      bottom: 7px;
      border-radius: 50%;
      background: inherit;
    }
    .weather-cloud::before {
      left: 12px;
      width: 30px;
      height: 30px;
    }
    .weather-cloud::after {
      right: 13px;
      width: 39px;
      height: 39px;
    }
    .weather-cloud.one { left: 22%; top: 30%; }
    .weather-cloud.two { left: 56%; top: 21%; transform: scale(.82); animation-delay: -.8s; }
    .weather-cloud.three { left: 40%; top: 53%; transform: scale(.66); animation-delay: -1.4s; }
    .weather-drop,
    .weather-snowflake {
      position: absolute;
      top: -14px;
      left: var(--x);
      animation-delay: var(--delay);
      animation-duration: var(--duration);
      animation-iteration-count: infinite;
      animation-timing-function: linear;
    }
    .weather-drop {
      width: 2px;
      height: 17px;
      border-radius: 999px;
      background: rgba(0, 102, 204, .48);
      transform: rotate(12deg);
      animation-name: weatherRainFall;
    }
    .weather-snowflake {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 0 10px rgba(0, 102, 204, .12);
      animation-name: weatherSnowFall;
    }
    .weather-lightning {
      position: absolute;
      left: 70%;
      top: 16%;
      width: 30px;
      height: 44px;
      opacity: .58;
      clip-path: polygon(44% 0, 72% 0, 58% 35%, 82% 35%, 33% 100%, 46% 52%, 24% 52%);
      background: rgba(255, 203, 64, .82);
      animation: weatherLightning 3.2s steps(1, end) infinite;
    }
    .weather-mist-band {
      position: absolute;
      left: -16%;
      width: 132%;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .42);
      filter: blur(7px);
      animation: weatherMistMove 5.8s ease-in-out infinite alternate;
    }
    .weather-mist-band.one { top: 28%; }
    .weather-mist-band.two { top: 45%; animation-delay: -.9s; opacity: .72; }
    .weather-mist-band.three { top: 62%; animation-delay: -1.6s; opacity: .58; }
    .weather-sunny .weather-animation-badge { color: #9a5b00; }
    .weather-cloudy .weather-animation-badge { color: #425466; }
    .weather-rain .weather-animation-badge { color: var(--apple-blue); }
    .weather-snow .weather-animation-badge { color: #2f6f9f; }
    .weather-fog .weather-animation-badge { color: #697386; }
    @keyframes weatherSunPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes weatherCloudDrift {
      0% { margin-left: -8px; }
      100% { margin-left: 14px; }
    }
    @keyframes weatherRainFall {
      0% { transform: translateY(-20px) rotate(12deg); opacity: 0; }
      12% { opacity: .78; }
      100% { transform: translateY(260px) rotate(12deg); opacity: 0; }
    }
    @keyframes weatherSnowFall {
      0% { transform: translate3d(0, -16px, 0); opacity: 0; }
      14% { opacity: .86; }
      100% { transform: translate3d(18px, 250px, 0); opacity: 0; }
    }
    @keyframes weatherLightning {
      0%, 82%, 100% { opacity: 0; }
      84%, 87% { opacity: .74; }
      90% { opacity: 0; }
      92% { opacity: .42; }
    }
    @keyframes weatherMistMove {
      0% { transform: translateX(-18px); }
      100% { transform: translateX(22px); }
    }
    .map-route-marker {
      display: inline-grid;
      grid-template-columns: 24px;
      align-items: center;
      width: 24px;
      height: 24px;
      transform: translateY(-6px);
      pointer-events: none;
      overflow: visible;
      filter: drop-shadow(0 6px 14px rgba(31, 41, 51, .16));
    }
    .map-route-marker-left {
      transform: translateY(-6px);
    }
    .map-route-index {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: var(--gold);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }
    .map-fallback {
      position: absolute;
      inset: 0;
      padding: 12px;
      display: grid;
      place-items: center;
      color: #30445a;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      pointer-events: none;
      z-index: 5;
    }
    .map-fallback-overlay {
      place-items: end center;
      padding: 8px 10px;
      background: rgba(245,245,247,.72);
    }
    .map-fallback-card {
      width: min(96%, 430px);
      padding: 8px 10px;
      border: 1px solid rgba(183,121,31,.20);
      border-radius: 8px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 8px 24px rgba(18, 38, 63, .12);
      backdrop-filter: blur(6px);
    }
    .map-fallback-card strong {
      display: block;
      margin-bottom: 5px;
      color: #7a4e0c;
      font-size: 12px;
    }
    .map-fallback-route {
      width: min(96%, 380px);
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .map-fallback-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--gold);
      font-size: 11px;
      box-shadow: 0 5px 14px rgba(183,121,31,.22);
    }
    .map-fallback-line {
      width: 18px;
      height: 2px;
      background: rgba(183,121,31,.55);
    }
    .map-fallback-stops {
      margin-top: 4px;
      color: #425466;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-info {
      position: relative;
      z-index: 7;
      min-height: 28px;
      padding: 6px 12px;
      border-top: 1px solid rgba(217,226,236,.74);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      max-height: 78px;
      overflow: auto;
      display: grid;
      gap: 4px;
    }
    .map-info-route {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .map-info-route strong {
      color: var(--apple-ink);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-info-stops {
      display: block;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-info-weather {
      display: block;
      padding-top: 3px;
      border-top: 1px solid var(--apple-divider-soft);
      color: var(--apple-blue);
      white-space: normal;
    }
    .stage-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }
    .stage-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .interest-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quick-btn {
      padding: 8px 10px;
      background: #edf2f7;
      color: #30445a;
    }
    .quick-btn.active { background: #f6e7c1; color: #7a4e0c; }
    .chat {
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      display: flex;
      gap: 10px;
      max-width: 88%;
    }
    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--gold);
      flex: 0 0 auto;
      font-size: 15px;
    }
    .msg.user .avatar { background: var(--blue); }
    .bubble {
      padding: 11px 13px;
      border-radius: 13px;
      background: #f3f5f8;
      line-height: 1.65;
      white-space: pre-wrap;
      font-size: 14px;
    }
    .msg-meta {
      margin-top: 7px;
      padding-top: 6px;
      border-top: 1px solid rgba(105, 115, 134, .18);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .msg.user .bubble { background: #2563eb; color: #fff; }
    .composer {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 9px;
      background: #fff;
    }
    .composer-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 34px;
    }
    .tool-btn {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 10px;
      background: #edf2f7;
      color: #30445a;
      font-size: 13px;
      font-weight: 700;
    }
    .tool-btn.danger {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
    }
    .tool-btn:disabled,
    .primary-btn:disabled,
    .secondary-btn:disabled {
      cursor: not-allowed;
      opacity: .55;
    }
    .voice-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .composer input {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 14px;
      outline: none;
      background: #fbfcfd;
    }
    .composer input:focus { border-color: var(--gold); }
    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: #edf2f7;
      color: var(--ink);
      font-size: 18px;
    }
    .icon-btn.primary { background: var(--gold); color: #fff; }
    .icon-btn.listening { background: var(--red); color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.35); }
      50% { box-shadow: 0 0 0 12px rgba(220,38,38,0); }
    }
    .admin-view {
      height: 100%;
      overflow: hidden;
      display: block;
    }
    .admin-shell {
      height: 100%;
      min-height: 0;
      width: min(100%, 1480px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .admin-page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .admin-page-header h2 {
      margin: 0;
      font-size: 20px;
    }
    .admin-page-header p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
    }
    .admin-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .admin-page-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 16px;
      align-content: start;
    }
    .admin-grid {
      display: grid;
      gap: 16px;
      align-items: start;
    }
    .admin-grid.two { grid-template-columns: minmax(360px, .9fr) minmax(420px, 1.1fr); }
    .admin-grid.three { grid-template-columns: repeat(3, minmax(180px, 1fr)); }
    .admin-card { padding: 18px; }
    .admin-card h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }
    .admin-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .admin-card.compact {
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .admin-card.compact p { margin: 0; }
    .dashboard-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;

    const GSV_VOICE_OPTIONS = [
      ["lingshan_guide_female", "内置 · 灵山女导游"],
      ["cultural_narrator_male", "内置 · 文化讲解男声"],
      ["family_friendly", "内置 · 亲子活泼声线"],
      ["custom", "内置 · 自定义音色"]
    ];

    const EDGE_VOICE_OPTIONS = [
      ["zh-CN-XiaoxiaoNeural", "晓晓 - 温和女声"],
      ["zh-CN-XiaoyiNeural", "晓伊 - 亲和女声"],
      ["zh-CN-YunxiNeural", "云希 - 年轻男声"],
      ["zh-CN-YunjianNeural", "云健 - 稳重男声"],
      ["zh-CN-YunyangNeural", "云扬 - 播报男声"],
      ["zh-CN-liaoning-XiaobeiNeural", "东北女声"],
      ["zh-CN-shaanxi-XiaoniNeural", "陕西女声"]
    ];

    const AVATAR_PRESET_FIELDS = [
      "name",
      "model",
      "appearance",
      "costume",
      "emotion_enabled",
      "style",
      "opening",
      "voice_provider",
      "voice_preset",
      "voice_description",
      "voice_clone_id",
      "edge_voice",
      "voice_rate",
      "voice_pitch",
      "voice_volume"
    ];

    function cloneAvatarPreset(preset) {
      return Object.assign({}, preset || {});
    }

    function defaultAvatarPresets() {
      return DEFAULT_AVATAR_PRESETS.map(cloneAvatarPreset);
    }

    function avatarPresetLabel(provider) {
      return normalizeVoiceProvider(provider) === "gpt_sovits" ? "GSV-TTS-Lite 克隆音色" : "Edge-TTS 在线音色";
    }

    function matchAvatarPresetId(config, presets) {
      const source = config || {};
      const options = Array.isArray(presets) && presets.length ? presets : defaultAvatarPresets();
      const compareFields = ["model", "appearance", "costume", "style", "voice_provider", "voice_preset", "edge_voice", "voice_rate"];
      let bestId = "custom";
      let bestScore = 0;
      for (const preset of options) {
        let score = 0;
        for (const key of compareFields) {
          if (String(source[key] || "").trim() === String(preset[key] || "").trim()) score += 1;
        }
        if (score > bestScore) {
          bestScore = score;
          bestId = preset.id;
        }
      }
      return bestScore >= 3 ? bestId : "custom";
    }

    function buildCustomAvatarPreset(config) {
      const source = config || {};
      const presetId = String(source.avatar_preset_id || source.id || "custom").trim() || "custom";
      return {
        id: presetId,
        label: source.label || "自定义当前配置",
        summary: source.summary || "当前配置未完全匹配预设，可作为临时方案保存。",
        name: source.name || "灵小境",
        model: source.model || "Haru",
        appearance: source.appearance || "自定义当前配置",
        costume: source.costume || "",
        emotion_enabled: String(source.emotion_enabled || "true"),
        style: source.style || "",
        opening: source.opening || "",
        voice_provider: normalizeVoiceProvider(source.voice_provider || "gpt_sovits"),
        voice_preset: source.voice_preset || "custom",
        voice_description: source.voice_description || "",
        voice_clone_id: source.voice_clone_id || "",
        edge_voice: source.edge_voice || "zh-CN-XiaoxiaoNeural",
        voice_rate: source.voice_rate || "+0%",
        voice_pitch: source.voice_pitch || "+0Hz",
        voice_volume: source.voice_volume || "+0%",
      };
    }

    function avatarPresetCatalog(config) {
      const source = config || state.config || {};
      const presets = Array.isArray(source.avatar_presets) && source.avatar_presets.length
        ? source.avatar_presets.map(cloneAvatarPreset)
        : defaultAvatarPresets();
      const presetId = String(source.avatar_preset_id || "").trim();
      const hasPresetId = presetId && presets.some(preset => preset.id === presetId);
      const matchedId = matchAvatarPresetId(source, presets);
      if (presetId && !hasPresetId) {
        presets.push(buildCustomAvatarPreset(Object.assign({}, source, {
          id: presetId,
          avatar_preset_id: presetId
        })));
      } else if (presetId === "custom" || (!presetId && matchedId === "custom")) {
        presets.push(buildCustomAvatarPreset(source));
      }
      return presets;
    }

    function syncAvatarPresetState(config, forceSelection) {
      const source = config || state.config || {};
      const presets = avatarPresetCatalog(source);
      const knownIds = new Set(presets.map(preset => preset.id));
      const storedId = String(source.avatar_preset_id || "").trim();
      const matchedId = storedId && knownIds.has(storedId) ? storedId : matchAvatarPresetId(source, presets);
      state.savedAvatarPresetId = matchedId || "custom";
      if (forceSelection || !state.expandedAvatarPresetId || !knownIds.has(state.expandedAvatarPresetId)) {
        state.expandedAvatarPresetId = state.savedAvatarPresetId;
      }
      if (forceSelection) state.avatarDraft = null;
      return presets;
    }

    function selectedAvatarPresetConfig(config) {
      const source = config || state.config || {};
      const presets = avatarPresetCatalog(source);
      const knownIds = new Set(presets.map(preset => preset.id));
      const selectedId = String(state.expandedAvatarPresetId || source.avatar_preset_id || "").trim();
      const selectedPreset = presets.find(preset => preset.id === selectedId) || presets.find(preset => preset.id === state.savedAvatarPresetId);
      if (selectedPreset && knownIds.has(selectedPreset.id)) {
        return Object.assign({}, source, selectedPreset, {
          avatar_preset_id: selectedPreset.id,
          avatar_presets: presets
        });
      }
      const customPreset = buildCustomAvatarPreset(source);
      return Object.assign({}, customPreset, source, {
        avatar_preset_id: String(source.avatar_preset_id || "custom").trim() || "custom",
        avatar_presets: presets
      });
    }

    function editableAvatarConfig(config) {
      return Object.assign({}, selectedAvatarPresetConfig(config), state.avatarDraft || {});
    }

    function avatarPresetNumberLabel(index) {
      const labels = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
      return labels[index] || String(index);
    }

    function avatarPresetFromConfig(config) {
      const source = config || editableAvatarConfig();
      const preset = {
        id: String(source.avatar_preset_id || source.id || "custom").trim() || "custom",
        label: String(source.label || "自定义当前配置").trim() || "自定义当前配置",
        summary: String(source.summary || "").trim()
      };
      for (const key of AVATAR_PRESET_FIELDS) {
        preset[key] = String(source[key] === undefined || source[key] === null ? "" : source[key]).trim();
      }
      if (!preset.name) preset.name = "灵小境";
      if (!preset.model) preset.model = "Haru";
      if (!preset.emotion_enabled) preset.emotion_enabled = "true";
      if (!preset.voice_provider) preset.voice_provider = "gpt_sovits";
      if (!preset.voice_preset) preset.voice_preset = "lingshan_guide_female";
      if (!preset.edge_voice) preset.edge_voice = "zh-CN-XiaoxiaoNeural";
      if (!preset.voice_rate) preset.voice_rate = "+0%";
      if (!preset.voice_pitch) preset.voice_pitch = "+0Hz";
      if (!preset.voice_volume) preset.voice_volume = "+0%";
      return preset;
    }

    function upsertAvatarPreset(presets, config) {
      const nextPreset = avatarPresetFromConfig(config);
      const list = (Array.isArray(presets) && presets.length ? presets : defaultAvatarPresets()).map(cloneAvatarPreset);
      const index = list.findIndex(preset => preset.id === nextPreset.id);
      if (index >= 0) list[index] = Object.assign({}, list[index], nextPreset);
      else list.push(nextPreset);
      return list;
    }

    function persistCurrentAvatarDraftToCatalog() {
      const selectedId = String(state.expandedAvatarPresetId || state.config.avatar_preset_id || "").trim();
      if (!selectedId) return avatarPresetCatalog();
      const current = $("dhAvatarName") || $("dhVoiceProvider") ? readAvatarFormConfig() : editableAvatarConfig();
      const presets = upsertAvatarPreset(avatarPresetCatalog(), Object.assign({}, current, {
        avatar_preset_id: selectedId,
        id: selectedId
      }));
      state.avatarDraft = Object.assign({}, current, { avatar_preset_id: selectedId, id: selectedId });
      state.config = Object.assign({}, state.config, {
        avatar_presets: presets,
        avatar_preset_id: selectedId
      });
      return presets;
    }

    function avatarPresetsForSave(currentConfig) {
      const current = currentConfig || readAvatarFormConfig();
      return upsertAvatarPreset(avatarPresetCatalog(), Object.assign({}, current, {
        id: current.avatar_preset_id || state.expandedAvatarPresetId || state.savedAvatarPresetId || "custom"
      }));
    }

      const avatarConfig = readAvatarFormConfig();
      const voiceConfig = voiceConfigFromChoice(avatarConfig.voice_provider, $("dhVoiceChoice") ? $("dhVoiceChoice").value : selectedVoiceChoiceValue(avatarConfig), avatarConfig);
      const selectedId = avatarConfig.avatar_preset_id || state.expandedAvatarPresetId || state.savedAvatarPresetId || "custom";
      const current = Object.assign({}, avatarConfig, voiceConfig, {
        avatar_preset_id: selectedId,
        id: selectedId
      });
      const presets = avatarPresetsForSave(current);
      const data = Object.assign({}, current, {
        avatar_presets: presets
      });
      state.expandedAvatarPresetId = selectedId;
      state.avatarDraft = Object.assign({}, current, {
        avatar_presets: presets
      });
      state.config = Object.assign({}, state.config, data);
      return data;
    }

    function avatarModelOptions(currentPreset) {
      const baseOptions = Array.isArray(state.config.model_options) && state.config.model_options.length
        ? state.config.model_options
        : ["Haru", "Hiyori", "Mao", "Natori", "Rice", "Ren"];
      const options = baseOptions.map(item => String(item || "").trim()).filter(Boolean);
      const currentModel = String((currentPreset || {}).model || "").trim();
      if (currentModel && !options.includes(currentModel)) options.unshift(currentModel);
      return options;
    }

    function selectedVoiceChoiceValue(config) {
      const source = config || editableAvatarConfig();
      const provider = normalizeVoiceProvider(source.voice_provider);
      if (provider === "edge") {
        return "edge:" + (source.edge_voice || "zh-CN-XiaoxiaoNeural");
      }
      if (String(source.voice_clone_id || "").trim()) {
        return "clone:" + String(source.voice_clone_id || "").trim();
      }
      return "preset:" + (source.voice_preset || "lingshan_guide_female");
    }

    function buildVoiceChoiceOptions(provider, config) {
      const source = config || editableAvatarConfig();
      const normalized = normalizeVoiceProvider(provider || source.voice_provider);
      if (normalized === "edge") {
        return EDGE_VOICE_OPTIONS.map(([id, label]) => ({ value: "edge:" + id, label }));
      }
      const options = GSV_VOICE_OPTIONS.map(([id, label]) => ({ value: "preset:" + id, label }));
      const cloneOptions = state.voiceClones.map(voice => ({
        value: "clone:" + voice.id,
        label: "上传音色 · " + voice.name + (voice.audio_exists ? "" : "（音频缺失）")
      }));
      const currentCloneId = String(source.voice_clone_id || "").trim();
      if (currentCloneId && !state.voiceClones.some(voice => voice.id === currentCloneId)) {
        cloneOptions.unshift({ value: "clone:" + currentCloneId, label: "上传音色 · " + currentCloneId });
      }
      return options.concat(cloneOptions);
    }

    function voiceConfigFromChoice(provider, choice, fallback) {
      const current = fallback || editableAvatarConfig();
      const normalized = normalizeVoiceProvider(provider || current.voice_provider);
      const rawChoice = String(choice || "").trim();
      const result = {
        voice_provider: normalized,
        voice_preset: current.voice_preset || "lingshan_guide_female",
        voice_clone_id: "",
        edge_voice: current.edge_voice || "zh-CN-XiaoxiaoNeural"
      };
      if (normalized === "edge") {
        result.edge_voice = rawChoice.startsWith("edge:") ? rawChoice.slice(5) : result.edge_voice;
        result.voice_clone_id = "";
        return result;
      }
      if (rawChoice.startsWith("clone:")) {
        result.voice_preset = "custom";
        result.voice_clone_id = rawChoice.slice(6);
        return result;
      }
      if (rawChoice.startsWith("preset:")) {
        result.voice_preset = rawChoice.slice(7) || result.voice_preset;
        result.voice_clone_id = "";
        return result;
      }
      if (String(current.voice_clone_id || "").trim()) {
        result.voice_preset = "custom";
        result.voice_clone_id = String(current.voice_clone_id || "").trim();
      }
      return result;
    }

    async function deleteAvatarPreset(presetId) {
      const selectedId = String(presetId || state.expandedAvatarPresetId || state.config.avatar_preset_id || "").trim();
      const presets = avatarPresetCatalog();
      const target = presets.find(preset => preset.id === selectedId);
      if (!target) return;
      if (presets.length <= 1) {
        alert("至少需要保留一个数字人配置。");
        return;
      }
      const label = target.label || target.name || "当前配置";
      if (!confirm(`确定删除“${label}”吗？删除后会立即保存到后端。`)) return;
      const previousConfig = state.config;
      const previousDraft = state.avatarDraft;
      const previousExpandedId = state.expandedAvatarPresetId;
      const currentSelectedId = String(state.expandedAvatarPresetId || state.config.avatar_preset_id || "").trim();
      const sourcePresets = selectedId === currentSelectedId ? presets : persistCurrentAvatarDraftToCatalog();
      const nextPresets = sourcePresets.filter(preset => preset.id !== selectedId);
      if (!nextPresets.length) {
        alert("至少需要保留一个数字人配置。");
        return;
      }
      const nextSelected = nextPresets.some(preset => preset.id === currentSelectedId) ? currentSelectedId : nextPresets[0].id;
      const nextPreset = nextPresets.find(preset => preset.id === nextSelected) || nextPresets[0];
      state.expandedAvatarPresetId = nextPreset.id;
      state.avatarDraft = Object.assign({}, cloneAvatarPreset(nextPreset), {
        avatar_preset_id: nextPreset.id,
        avatar_presets: nextPresets
      });
      state.config = Object.assign({}, state.config, nextPreset, {
        avatar_preset_id: nextPreset.id,
        avatar_presets: nextPresets
      });
      const payload = Object.assign({}, nextPreset, {
        avatar_preset_id: nextPreset.id,
        avatar_presets: nextPresets
      });
      state.configMutationSeq = (state.configMutationSeq || 0) + 1;
      state.configSaving = true;
      renderPreservingAdminScroll();
      try {
        state.config = await apiPost("/api/admin/config", payload);
        syncAvatarPresetState(state.config, true);
        initMessages();
        alert("数字人配置已删除。");
      } catch (e) {
        state.config = previousConfig;
        state.avatarDraft = previousDraft;
        state.expandedAvatarPresetId = previousExpandedId;
        alert("删除失败：" + (e.message || "请确认管理员登录状态和后端服务。"));
      } finally {
        state.configMutationSeq = (state.configMutationSeq || 0) + 1;
        state.configSaving = false;
        renderPreservingAdminScroll();
      }
    }

    async function apiGet(path) {
      const res = await fetch(API + path, { headers: authHeaders() });
      if (res.status === 401 && !path.startsWith("/api/auth/")) handleUnauthorized();
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(payload.error || payload.correction_error || path + " " + res.status);
      return payload;
    }

    async function apiPost(path, data) {
      const res = await fetch(API + path, {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify(data || {})
      });
      if (res.status === 401 && !path.startsWith("/api/auth/")) handleUnauthorized();
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(payload.error || path + " " + res.status);
      return payload;
    }

    async function evaluationFetchWithTimeout(path, options, timeoutMs, timeoutMessage) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs || evaluationProgressRequestTimeoutMs);
      try {
        const fetchOptions = Object.assign({}, options || {}, { signal: controller.signal });
        const res = await fetch(API + path, fetchOptions);
        if (res.status === 401 && !path.startsWith("/api/auth/")) handleUnauthorized();
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(payload.error || path + " " + res.status);
        return payload;
      } catch (e) {
        if (e && e.name === "AbortError") {
          const timeoutError = new Error(timeoutMessage || "评测请求超时，请稍后重试。");
          timeoutError.isTimeout = true;
          throw timeoutError;
        }
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

      const res = await fetch(API + path, {

        headers: authHeaders(),
        body: formData
      });
      if (res.status === 401 && !path.startsWith("/api/auth/")) handleUnauthorized();

    function currentStageMode() {
      if (state.realtimeSessionActive || state.isListening) return "listening";
      if (state.isTyping || state.voiceBusy) return "thinking";
      if (state.isSpeaking || hasActiveSpeechPlayback()) return "speaking";
      if (state.selectedRouteMap) return "route-active";
      return "idle";
    }

    function currentRouteSummary() {
      const route = state.selectedRouteMap;
      if (!route) return {
        name: "等待选择路线",
        next: "从核心景点开始",
        pace: "选择兴趣后生成",
        action: "点景点卡开始讲解"
      };
      const routeMeta = (state.routes || []).find(item => item.id === route.id) || {};
      const points = route.points || [];
      const duration = route.duration || routeMeta.duration || "";
      const pointText = points.length ? `${points.length}站` : "";
      const reason = route.recommendation_reason || routeMeta.recommendation_reason || route.summary || routeMeta.summary || "";
      return {
        name: route.name || "灵山推荐路线",
        next: points.length ? `下一站 · ${points[0].name}` : "路线已准备",
        pace: [duration, pointText].filter(Boolean).join(" · ") || "按兴趣生成",
        action: reason || "先看地图，再听讲解"
      };
    }

    function renderStageRouteSteps(route) {
      const selectedRoute = route || state.selectedRouteMap;
      const points = selectedRoute && selectedRoute.points ? selectedRoute.points : [];
      if (!points.length) {
        return [
          ["1", "选择兴趣路线"],
          ["2", "查看地图标记"],
          ["3", "点击景点开始讲解"]
        ].map(([index, text]) => `<li><b>${index}</b><span>${text}</span></li>`).join("");
      }
      const visible = points.slice(0, 7);
      const steps = visible.map((point, index) => {
        const order = point.order || index + 1;
        const name = point.name || "路线节点";
        return `<li><b>${escapeHtml(String(order))}</b><span>${escapeHtml(name)}</span></li>`;
      });
      if (points.length > visible.length) {
        steps.push(`<li><b>+</b><span>共 ${points.length} 站，地图中继续查看</span></li>`);
      }
      return steps.join("");
    }

      const route = state.selectedRouteMap || ensureDefaultRouteMap();
      askRoute((route && route.id) || "route_history");
    }

    function askNextStageSpot() {
      const route = state.selectedRouteMap || ensureDefaultRouteMap();
      const point = route && route.points && route.points[0];
      if (point && point.id) {

        return;
      }
      sendMessage("请介绍灵山胜境的核心景点。");
    }

    function routeRecommendationReason(route) {
      const context = route && route.recommendation_context ? route.recommendation_context : {};
      return route && route.recommendation_reason ? String(route.recommendation_reason) : "";
    }

    function evaluationModeLabel(mode) {
      return mode === "local" ? "本地基线" : "DeepSeek + 本地 RAG 评测";
    }

    function evaluationProviderSummary(ev) {
      const stats = ev && ev.provider_stats ? ev.provider_stats : {};
      const parts = [];
      if (stats.deepseek) parts.push(`真实 DeepSeek ${stats.deepseek} 题`);
      if (stats.direct_fact) parts.push(`规则直答 ${stats.direct_fact} 题`);
      if (stats.local) parts.push(`本地回答 ${stats.local} 题`);
      if (stats.local_fallback_after_llm_error) parts.push(`本地兜底 ${stats.local_fallback_after_llm_error} 题`);
      if (stats.deepseek_error) parts.push(`DeepSeek 失败 ${stats.deepseek_error} 题`);
      if (stats.unknown) parts.push(`旧版未知来源 ${stats.unknown} 题`);
      return parts.length ? parts.join(" · ") : "回答来源：暂无明细";
    }

    const EVALUATION_HIGH_RISK_IDS = new Set(["Q021", "Q022", "Q023", "Q027", "Q051", "Q058", "Q086"]);

    function evaluationCaseStatus(item) {
      const score = Number(item && item.score || 0);
      if (score >= 8) return "pass";
      if (EVALUATION_HIGH_RISK_IDS.has(String(item && item.id || ""))) return "risk";
      return "low";
    }

    function evaluationStatusLabel(status) {
      if (status === "pass") return "通过";
      if (status === "risk") return "高风险";
      if (status === "low") return "低分";
      return "全部状态";
    }

    function evaluationModeCases(mode) {
      const ev = (state.evaluations && state.evaluations[mode]) || {};
      return (ev.case_items || []).map(item => Object.assign({ mode }, item));
    }

    function filteredEvaluationCases() {
      const selectedMode = state.evaluationDetailMode || "deepseek";
      const modes = selectedMode === "all" ? ["deepseek", "local"] : [selectedMode === "local" ? "local" : "deepseek"];
      const category = state.evaluationDetailCategory || "all";
      const status = state.evaluationDetailStatus || "all";
      const query = String(state.evaluationDetailQuery || "").trim().toLowerCase();
      return modes.reduce((items, mode) => items.concat(evaluationModeCases(mode)), []).filter(item => {
        const caseStatus = evaluationCaseStatus(item);
        const haystack = [item.id, item.category, item.question, item.answer, evaluationModeLabel(item.mode)].join(" ").toLowerCase();
        if (category !== "all" && item.category !== category) return false;
        if (status !== "all" && caseStatus !== status) return false;
        return !query || haystack.includes(query);
      });
    }

    function evaluationCaseCategories() {
      const categories = new Set();
      ["deepseek", "local"].forEach(mode => {
        const ev = (state.evaluations && state.evaluations[mode]) || {};
        (ev.category_stats || []).forEach(stat => stat.category && categories.add(stat.category));
        (ev.case_items || []).forEach(item => item.category && categories.add(item.category));
      });
      return Array.from(categories).sort();
    }

    function buildEvaluationCategoryStatsFromCases(cases) {
      const grouped = {};
      (cases || []).forEach(item => {
        const category = item.category || "uncategorized";
        const bucket = grouped[category] || { category, total: 0, passed: 0, low_score: 0, scoreSum: 0 };
        const score = Number(item.score || 0);
        bucket.total += 1;
        bucket.scoreSum += score;
        if (score >= 8) bucket.passed += 1;
        else bucket.low_score += 1;
        grouped[category] = bucket;
      });
      return Object.keys(grouped).sort().map(category => {
        const bucket = grouped[category];
        return {
          category,
          total: bucket.total,
          passed: bucket.passed,
          low_score: bucket.low_score,
          avg_score: bucket.total ? Math.round(bucket.scoreSum / bucket.total * 10) / 10 : 0,
          pass_rate: bucket.total ? bucket.passed / bucket.total : 0
        };
      });
    }

    function setEvaluationDetailMode(mode) {

    function renderEvaluationVisualSummary(categoryStats) {

      const buckets = [
        { name: "9-10分", count: cases.filter(item => Number(item.score || 0) >= 9).length },

      const stats = (categoryStats && categoryStats.length && state.evaluationDetailMode !== "all") ? categoryStats : buildEvaluationCategoryStatsFromCases(cases);
      const maxCategoryTotal = Math.max(1, ...stats.map(item => item.total || 0));

      return `

              ${failureRows.map(name => `<div class="bar-row"><span>${escapeHtml(name)}</span><div class="bar"><i style="width:${Math.round((failures[name] || 0) / maxBucket * 100)}%"></i></div><b>${escapeHtml(String(failures[name] || 0))}</b></div>`).join("")}

    function render() {
      const user = state.auth.user || {};
      const isAdmin = user.role === "admin";
      if (!isAdmin && state.mode === "admin") state.mode = "tourist";
      const shouldPreserveEvaluationScroll = state.mode === "admin" && Boolean(state.evaluationBusy);
      const evaluationScrollElement = shouldPreserveEvaluationScroll ? getAdminScrollElement() : null;
      const evaluationScrollTop = evaluationScrollElement ? evaluationScrollElement.scrollTop : 0;
      const evaluationScrollLeft = evaluationScrollElement ? evaluationScrollElement.scrollLeft : 0;
      const restoreEvaluationScroll = shouldPreserveEvaluationScroll ? () => {
        const nextScrollElement = getAdminScrollElement();
        if (nextScrollElement) {
          nextScrollElement.scrollTop = evaluationScrollTop;
          nextScrollElement.scrollLeft = evaluationScrollLeft;
        }
      } : null;
      $("appView").dataset.mode = state.mode;
      $("touristTab").classList.toggle("active", state.mode === "tourist");
      $("adminTab").classList.toggle("active", state.mode === "admin");
      $("adminTab").classList.toggle("hidden", !isAdmin);
      $("touristView").classList.toggle("hidden", state.mode !== "tourist");
      $("adminView").classList.toggle("hidden", state.mode !== "admin");
      $("pageTitle").textContent = state.mode === "tourist" ? "游客交互台" : "管理后台";
      $("pageSubtitle").textContent = state.mode === "tourist" ? "语音输入、文本对话、数字人口型同步" : "管理后台 · " + adminPageMeta().title;
      const globalStopSpeechBtn = $("globalStopSpeechBtn");
      const canStopSpeech = hasActiveSpeechPlayback();
      if (globalStopSpeechBtn) globalStopSpeechBtn.classList.toggle("hidden", !canStopSpeech);
      renderSide();
      if (state.mode === "tourist") renderTourist();
      else renderAdmin();
      if (restoreEvaluationScroll) {
        restoreEvaluationScroll();
        requestAnimationFrame(restoreEvaluationScroll);
      }
      requestAnimationFrame(refreshLucideIcons);
    }

    function setMode(mode) {

        return;
      }
      state.mode = mode;
      if (mode === "admin") loadAdminData();
      render();
    }

    async function loadRoutes(interest, options) {
      try {
        const data = await apiGet("/api/routes" + (interest ? "?interest=" + encodeURIComponent(interest) : ""));
        state.routes = data.routes || [];
        ensureDefaultRouteMap(options);
        renderSide();
        if (state.mapReady && state.selectedRouteMap) highlightRouteOnMap(state.selectedRouteMap);
        else updateMapPanelText();
      } catch (e) {
        console.warn(e);
      }
    }

    function ensureDefaultRouteMap(options) {
      options = options || {};
      const routes = state.routes || [];
      const currentId = state.selectedRouteMap && state.selectedRouteMap.id;
      const currentStillAvailable = currentId && routes.some(route => route.map && route.map.id === currentId);
      if (!options.preferFirst && state.selectedRouteMap && currentStillAvailable) return state.selectedRouteMap;
      const route = routes.find(item => item && item.map && item.map.points && item.map.points.length);
      if (!route || !route.map) return null;
      state.selectedRouteMap = route.map;
      selectPanoramaScenic(route.map.points && route.map.points[0]);
      if (options.preferFirst || !state.mapStatus || state.mapStatus === "地图准备中" || state.mapStatus.indexOf("默认路线：") === 0) {
        state.mapStatus = "默认路线：" + (route.map.name || route.name || "灵山推荐路线");
      }
      return state.selectedRouteMap;
    }

    function updateMapPanelText() {
      const status = $("mapStatusText");
      const info = $("mapInfoText");
      if (status) status.textContent = state.mapStatus || "地图准备中";
      if (info) {
        const route = state.selectedRouteMap;
        const routeText = route && route.name ? `${route.name} · ${route.points ? route.points.length : 0} 个标记点` : "选择路线或景点后，这里会标记游览顺序。";
        const stopText = routeStopSummary(route);
        const weatherText = state.mapWeather || "";
        const routeHtml = `<div class="map-info-route"><strong>${escapeHtml(routeText)}</strong>${stopText ? `<span class="map-info-stops">${escapeHtml(stopText)}</span>` : ""}</div>`;
        const weatherHtml = weatherText ? `<div class="map-info-weather">${escapeHtml(weatherText)}</div>` : "";
        const infoText = [routeText, stopText, weatherText].filter(Boolean).join("\n");
        info.innerHTML = routeHtml + weatherHtml;
        info.title = infoText;
      }
      syncMapFallbackState();
    }

    function selectPanoramaScenic(pointOrId) {
      if (!pointOrId) return "";
      const scenicId = typeof pointOrId === "string" ? pointOrId : (pointOrId.id || pointOrId.scenic_id || "");
      if (!scenicId) return "";
      state.selectedPanoramaScenicId = scenicId;
      return scenicId;
    }

    function currentPanoramaScenicId() {
      if (state.selectedPanoramaScenicId) return state.selectedPanoramaScenicId;
      if (state.selectedSpot) return state.selectedSpot;
      const route = state.selectedRouteMap;
      const firstPoint = route && route.points && route.points[0];
      return selectPanoramaScenic(firstPoint) || "LS-002";
    }

    async function openPanoramaViewer(scenicId) {
      const id = selectPanoramaScenic(scenicId) || currentPanoramaScenicId();
      const viewerUrl = "/panorama.html?scenic=" + encodeURIComponent(id);
      const popup = window.open(viewerUrl, "_blank", "noopener");
      try {
        const detail = await apiGet("/api/panorama/scenic/" + encodeURIComponent(id));
        selectPanoramaScenic(detail.scenic_id || id);
        if (!detail.available && detail.message) {
          state.mapStatus = detail.name ? detail.name + "：" + detail.message : detail.message;
          updateMapPanelText();
        }
      } catch (error) {
        state.mapStatus = "实景数据暂不可用：" + (error.message || "");
        updateMapPanelText();
      }
      if (!popup) window.location.href = viewerUrl;
    }

    async function openOverviewPanorama() {
      const viewerUrl = "/panorama.html?overview=1";
      const popup = window.open(viewerUrl, "_blank", "noopener");
      try {
        const detail = await apiGet("/api/panorama/overview");
        state.mapStatus = detail.available ? "已打开灵山胜境全景地图" : (detail.message || "暂无景区全景素材");
        updateMapPanelText();
      } catch (error) {
        state.mapStatus = "全景地图暂不可用：" + (error.message || "");
        updateMapPanelText();
      }
      if (!popup) window.location.href = viewerUrl;
    }

    function routeStopSummary(route) {
      const points = route && route.points ? route.points : [];
      if (!points.length) return "";
      return points.map((point, index) => `${point.order || index + 1}. ${point.name}`).join(" → ");
    }

    function syncMapFallbackState() {
      if (!$("mapFallback")) return;
      const route = state.selectedRouteMap || ensureDefaultRouteMap();
      if (lingshanMap.instance) {
        hideMapFallback();
        return;
      }
      if (route) {
        showMapFallback(state.mapStatus || "本地路线示意", route);
        return;
      }
      if (state.mapStatus && state.mapStatus !== "3D 地图已就绪") {
        showMapFallback(state.mapStatus, null);
      }
    }

    function buildStandaloneMapUrl(routeId) {
      const route = routeId || (state.selectedRouteMap && state.selectedRouteMap.id) || "route_history";
      const scenic = currentPanoramaScenicId();
      return "/map.html?route=" + encodeURIComponent(route) + "&scenic=" + encodeURIComponent(scenic);
    }

    function openStandaloneMap() {
      window.open(buildStandaloneMapUrl(), "_blank", "noopener");
    }

    async function loadMapConfig() {
      if (state.mapLoading || state.mapReady) return;
      state.mapLoading = true;
      try {
        const [config, scenics] = await Promise.all([
          apiGet("/api/map/config"),
          apiGet("/api/map/scenics")
        ]);
        state.mapConfig = config;
        state.mapScenics = scenics.points || [];
        ensureDefaultRouteMap();
        if (!config.ok) {
          state.mapStatus = config.error || "地图 Key 未配置，已使用本地路线示意。";
          showMapFallback(state.mapStatus, state.selectedRouteMap);
          return;
        }
        await loadAmapScript(config);
        initLingshan3DMap();
        state.mapReady = true;
        state.mapStatus = "3D 地图已就绪";
        if (state.selectedRouteMap) highlightRouteOnMap(state.selectedRouteMap);
      } catch (e) {
        state.mapStatus = "地图加载失败，已切换本地路线示意。";
        showMapFallback(state.mapStatus, state.selectedRouteMap);
      } finally {
        state.mapLoading = false;
        updateMapPanelText();
      }
    }

    function loadAmapScript(config) {
      if (window.AMap) return Promise.resolve(window.AMap);
      if (lingshanMap.scriptPromise) return lingshanMap.scriptPromise;
      window._AMapSecurityConfig = { securityJsCode: config.security_js_code || "" };
      lingshanMap.scriptPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(config.amap_key) + "&plugin=AMap.Walking";
        script.async = true;
        script.onload = () => window.AMap ? resolve(window.AMap) : reject(new Error("高德地图脚本未暴露 AMap。"));
        script.onerror = () => reject(new Error("高德地图脚本加载失败。"));
        document.head.appendChild(script);
      });
      return lingshanMap.scriptPromise;
    }

    async function loadAmapPlugins(plugins) {
      await loadMapConfig();
      if (!window.AMap) throw new Error("高德 JSAPI 尚未加载完成。");
      const missing = (plugins || []).filter(name => {
        const key = String(name || "").split(".").pop();
        return key && !window.AMap[key];
      });
      if (!missing.length) return window.AMap;
      return new Promise((resolve, reject) => {
        window.AMap.plugin(missing, () => resolve(window.AMap));
        setTimeout(() => reject(new Error("高德 JSAPI 插件加载超时。")), 6000);
      });
    }

    function initLingshan3DMap() {
      const el = $("lingshanAmap");
      if (!el || !window.AMap) return;
      lingshanMap.AMap = window.AMap;
      if (!lingshanMap.instance) {
        const config = state.mapConfig || {};
        lingshanMap.instance = new AMap.Map("lingshanAmap", {
          viewMode: "3D",
          pitch: config.pitch || 58,
          zoom: config.zoom || 16,
          center: config.center || [120.0948, 31.4216],
          mapStyle: "amap://styles/normal",
          resizeEnable: true,
          animateEnable: false,
          jogEnable: false
        });
      }
      drawScenicMarkers();
    }

    function drawScenicMarkers() {
      if (!lingshanMap.instance || !lingshanMap.AMap || !state.mapScenics.length) return;
      clearMapOverlays();
      const AMap = lingshanMap.AMap;
      lingshanMap.markers = state.mapScenics.map(point => new AMap.Marker({
        position: [point.lng, point.lat],
        title: point.name,
        label: { content: point.name, direction: "top" },
        anchor: "bottom-center",
        extData: point
      }));
      lingshanMap.markers.forEach((marker, index) => {
        const point = state.mapScenics[index];
        if (marker && marker.on && point) {
          marker.on("click", () => {
            selectPanoramaScenic(point);
            state.mapStatus = "已选择实景：" + point.name;
            updateMapPanelText();
          });
        }
      });
      lingshanMap.instance.add(lingshanMap.markers);
    }

    function clearMapOverlays() {
      if (!lingshanMap.instance) return;
      if (lingshanMap.polyline) {
        lingshanMap.instance.remove(lingshanMap.polyline);
        lingshanMap.polyline = null;
      }
      if (lingshanMap.markers.length) {
        lingshanMap.instance.remove(lingshanMap.markers);
        lingshanMap.markers = [];
      }
    }

    function mapRouteMarkerContent(point) {
      const markerTitle = `${point.order || ""}. ${point.name || ""}`.trim();
      return `
        <div class="map-route-marker" title="${escapeHtml(markerTitle)}">
          <span class="map-route-index">${escapeHtml(String(point.order || ""))}</span>
        </div>
      `;
    }

    function coordinateOf(item) {
      if (!item) return null;
      const lng = typeof item.getLng === "function" ? item.getLng() : (item.lng !== undefined ? item.lng : item[0]);
      const lat = typeof item.getLat === "function" ? item.getLat() : (item.lat !== undefined ? item.lat : item[1]);
      if (lng === undefined || lat === undefined) return null;
      return [Number(lng), Number(lat)];
    }

    function sameCoordinate(a, b) {
      return !!a && !!b && Math.abs(a[0] - b[0]) < 0.000001 && Math.abs(a[1] - b[1]) < 0.000001;
    }

    function isUsableWalkingSegment(segment, fallbackSegment) {
      const fallbackLength = fallbackSegment ? fallbackSegment.length : 0;
      if (!segment || segment.length < 2) return false;
      if (fallbackLength > 3 && segment.length < 4) return false;
      if (fallbackLength >= 5 && segment.length < fallbackLength) return false;
      return true;
    }

    function appendPath(target, path) {
      (path || []).forEach(item => {
        const point = coordinateOf(item);
        if (!point) return;
        if (target.length && sameCoordinate(target[target.length - 1], point)) return;
        target.push(point);
      });
    }

    function searchWalkingSegment(walking, start, end) {
      return new Promise(resolve => {
        const timer = setTimeout(() => resolve([]), 12000);
        walking.search(start, end, (status, result) => {
          clearTimeout(timer);
          if (status !== "complete" || !result || !result.routes || !result.routes[0]) {
            resolve([]);
            return;
          }
          const segment = [];
          (result.routes[0].steps || []).forEach(step => appendPath(segment, step.path || []));
          resolve(segment);
        });
      });
    }

    function findPathIndex(path, target, fromIndex) {
      if (!path || !target) return -1;
      const start = Math.max(0, Number(fromIndex) || 0);
      for (let i = start; i < path.length; i += 1) {
        if (sameCoordinate(coordinateOf(path[i]), target)) return i;
      }
      return -1;
    }

    function segmentFallbackPath(mapData, start, end, fromIndex) {
      const path = controlledRoutePath(mapData);
      if (!path.length) return { path: [], nextIndex: fromIndex || 0 };
      const startCoord = coordinateOf(start);
      const endCoord = coordinateOf(end);
      const startIndex = findPathIndex(path, startCoord, fromIndex || 0);
      const endIndex = startIndex >= 0 ? findPathIndex(path, endCoord, startIndex + 1) : -1;
      if (startIndex >= 0 && endIndex > startIndex) {
        return { path: path.slice(startIndex, endIndex + 1), nextIndex: endIndex };
      }
      return { path: [startCoord, endCoord].filter(Boolean), nextIndex: Math.max(0, fromIndex || 0) };
    }

    async function buildWalkableRoutePath(points, mapData) {
      const AMap = lingshanMap.AMap;
      const controlledPath = controlledRoutePath(mapData);
      if (controlledPath.length >= 2) return controlledPath;
      if (!AMap || !AMap.Walking || !points || points.length < 2) return [];
      const walking = new AMap.Walking({ map: null, panel: null });
      const path = [];
      const fallbackSegments = [];
      let fallbackIndex = 0;
      for (let i = 0; i < points.length - 1; i += 1) {
        const segmentFallback = segmentFallbackPath(mapData, points[i], points[i + 1], fallbackIndex);
        fallbackSegments.push(segmentFallback.path);
        fallbackIndex = segmentFallback.nextIndex;
      }
      for (let i = 0; i < points.length - 1; i += 1) {
        const start = [points[i].lng, points[i].lat];
        const end = [points[i + 1].lng, points[i + 1].lat];
        const segment = await searchWalkingSegment(walking, start, end);
        const segmentFallback = fallbackSegments[i];
        appendPath(path, isUsableWalkingSegment(segment, segmentFallback) ? segment : segmentFallback);
      }
      return path;
    }

    function drawRoutePolyline(path, source) {
      if (!lingshanMap.instance || !lingshanMap.AMap || !path || path.length < 2) return;
      lingshanMap.routePathSource = source || "fallback";
      lingshanMap.polyline = new lingshanMap.AMap.Polyline({
        path,
        strokeColor: "#b7791f",
        strokeWeight: 4,
        strokeOpacity: 0.86,
        lineJoin: "round",
        zIndex: 80
      });
      lingshanMap.instance.add(lingshanMap.polyline);
    }

    function fallbackRoutePath(mapData) {
      if (mapData && mapData.walk_polyline && mapData.walk_polyline.length >= 2) return mapData.walk_polyline;
      if (mapData && mapData.polyline && mapData.polyline.length >= 2) return mapData.polyline;
      return [];
    }

    function controlledRoutePath(mapData) {
      return mapData && mapData.walk_polyline && mapData.walk_polyline.length >= 2 ? mapData.walk_polyline : [];
    }

    function fitEmbeddedRouteBounds(mapData, points, AMap) {
      const bounds = mapData && mapData.bounds ? mapData.bounds : {};
      if (bounds.southwest && bounds.northeast) {
        lingshanMap.instance.setBounds(new AMap.Bounds(bounds.southwest, bounds.northeast), false, [38, 64, 38, 64]);
      } else if (points.length) {
        lingshanMap.instance.setCenter([points[0].lng, points[0].lat]);
      }
    }

    function waitForMapViewportUpdate() {
      return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    async function highlightRouteOnMap(routeOrMap) {
      const mapData = routeOrMap && routeOrMap.map ? routeOrMap.map : routeOrMap;
      if (!mapData) return;
      state.selectedRouteMap = mapData;
      state.mapStatus = mapData.name ? "已标记：" + mapData.name : "路线已标记";
      if (!lingshanMap.instance || !lingshanMap.AMap) {
        showMapFallback(state.mapStatus, mapData);
        updateMapPanelText();
        loadMapConfig();
        return;
      }
      const AMap = lingshanMap.AMap;
      const drawToken = ++lingshanMap.routeDrawToken;
      clearMapOverlays();
      const points = mapData.points || [];
      selectPanoramaScenic(points[0]);
      fitEmbeddedRouteBounds(mapData, points, AMap);
      await waitForMapViewportUpdate();
      if (drawToken !== lingshanMap.routeDrawToken) return;
      lingshanMap.markers = points.map(point => new AMap.Marker({
        position: [point.lng, point.lat],
        title: point.name,
        content: mapRouteMarkerContent(point),
        anchor: "bottom-center",
        offset: new AMap.Pixel(0, -6),
        extData: point
      }));
      lingshanMap.markers.forEach((marker, index) => {
        const point = points[index];
        if (marker && marker.on && point) {
          marker.on("click", () => {
            selectPanoramaScenic(point);
            state.mapStatus = "已选择实景：" + point.name;
            updateMapPanelText();
          });
        }
      });
      if (lingshanMap.markers.length) lingshanMap.instance.add(lingshanMap.markers);
      state.mapStatus = mapData.name ? "正在加载景区步道路线：" + mapData.name : "正在加载景区步道路线";
      updateMapPanelText();
      const walkablePath = await buildWalkableRoutePath(points, mapData);
      if (drawToken !== lingshanMap.routeDrawToken) return;
      if (lingshanMap.polyline) {
        lingshanMap.instance.remove(lingshanMap.polyline);
        lingshanMap.polyline = null;
      }
      if (walkablePath.length >= 2) {
        const source = controlledRoutePath(mapData).length >= 2 ? "controlled" : "walkable";
        drawRoutePolyline(walkablePath, source);
        state.mapStatus = mapData.name ? "景区步道路线已就绪：" + mapData.name : "景区步道路线已就绪";
      } else {
        const controlledPath = controlledRoutePath(mapData);
        if (controlledPath.length >= 2) {
          drawRoutePolyline(controlledPath, "controlled");
          state.mapStatus = mapData.name ? "景区步道路线已就绪：" + mapData.name : "景区步道路线已就绪";
          updateMapPanelText();
          hideMapFallback();
          return;
        }
        const fallbackPath = fallbackRoutePath(mapData);
        drawRoutePolyline(fallbackPath, "fallback");
        state.mapStatus = mapData.name ? "已按本地路线标记：" + mapData.name : "路线已按本地路线标记";
      }
      updateMapPanelText();
      hideMapFallback();
    }

    function focusScenicOnMap(idOrName) {
      const key = String(idOrName || "");
      const point = state.mapScenics.find(item => item.id === key || item.name === key);
      if (!point) {
        loadMapConfig();
        return;
      }
      state.mapStatus = "已聚焦：" + point.name;
      selectPanoramaScenic(point);
      if (!lingshanMap.instance || !lingshanMap.AMap) {
        showMapFallback(state.mapStatus, { name: point.name, points: [point] });
        updateMapPanelText();
        loadMapConfig();
        return;
      }
      const AMap = lingshanMap.AMap;
      clearMapOverlays();
      const marker = new AMap.Marker({
        position: [point.lng, point.lat],
        title: point.name,
        label: { content: point.name, direction: "top" },
        anchor: "bottom-center"
      });
      if (marker && marker.on) {
        marker.on("click", () => {
          selectPanoramaScenic(point);
          state.mapStatus = "已选择实景：" + point.name;
          updateMapPanelText();
        });
      }
      lingshanMap.markers = [marker];
      lingshanMap.instance.add(marker);
      lingshanMap.instance.setZoomAndCenter(17, [point.lng, point.lat]);
      updateMapPanelText();
      hideMapFallback();
    }

    function hideMapFallback() {
      const fallback = $("mapFallback");
      if (!fallback) return;
      fallback.innerHTML = "";
      fallback.style.display = "none";
      fallback.classList.remove("map-fallback-overlay");
    }

    function showMapFallback(message, route) {
      const fallback = $("mapFallback");
      if (!fallback) return;
      if (!message && lingshanMap.instance) {
        hideMapFallback();
        return;
      }
      const points = route && route.points ? route.points : [];
      fallback.style.display = "grid";
      fallback.classList.toggle("map-fallback-overlay", !!(lingshanMap.instance && points.length));
      const stopText = points.slice(0, 8).map((point, index) => `${point.order || index + 1}. ${point.name}`).join(" → ");
      fallback.innerHTML = points.length ? `
        <div class="map-fallback-card">
          <strong>${escapeHtml(message || "本地路线示意")}</strong>
          <div class="map-fallback-route">
            ${points.slice(0, 8).map((point, index) => `
              <span class="map-fallback-dot" title="${escapeHtml(point.name)}">${escapeHtml(String(point.order || index + 1))}</span>
              ${index < Math.min(points.length, 8) - 1 ? `<span class="map-fallback-line"></span>` : ""}
            `).join("")}
          </div>
          <div class="map-fallback-stops">${escapeHtml(stopText)}</div>
        </div>
      ` : `<div>${escapeHtml(message || "地图暂不可用。")}</div>`;
    }

    function extractToolText(data) {
      if (!data) return "";
      const value = data.data !== undefined ? data.data : data;
      if (typeof value === "string") return value;
      if (Array.isArray(value)) return value.map(extractToolText).filter(Boolean).join(" ");
      if (typeof value === "object") {
        if (value.text) return String(value.text);
        if (value.content) return extractToolText(value.content);
        return Object.keys(value).slice(0, 8).map(key => `${key}:${extractToolText(value[key]) || value[key]}`).join(" ");
      }
      return String(value || "");
    }

    function weatherAnimationTypeFromText(text) {
      const value = String(text || "");
      if (/雪|雨夹雪|冰雹/.test(value)) return "snow";
      if (/雷阵雨|雷雨|暴雨|大雨|中雨|小雨|阵雨|雨/.test(value)) return "rain";
      if (/雾|霾|沙尘|浮尘/.test(value)) return "fog";
      if (/晴/.test(value)) return "sunny";
      if (/阴|多云|云/.test(value)) return "cloudy";
      return "cloudy";
    }

    function weatherAnimationLabel(type) {
      if (type === "sunny") return "晴 · 阳光";
      if (type === "rain") return "雨 · 注意防滑";
      if (type === "snow") return "雪 · 慢行保暖";
      if (type === "fog") return "雾霾 · 注意能见度";
      return "云 · 舒适游览";
    }

    function weatherParticleMarkup(className, count) {
      return Array.from({ length: count }, (_, index) => {
        const left = (index * 37 + 9) % 100;
        const delay = ((index % 9) * .17).toFixed(2);
        const duration = (2.7 + (index % 6) * .22).toFixed(2);
        return `<span class="${className}" style="--x:${left}%;--delay:${delay}s;--duration:${duration}s"></span>`;
      }).join("");
    }

    function weatherAnimationMarkup(type) {
      const badge = `<span class="weather-animation-badge">${weatherAnimationLabel(type)}</span>`;
      if (type === "sunny") {
        return badge + `<span class="weather-sun"></span><span class="weather-cloud one"></span><span class="weather-cloud two"></span>`;
      }
      if (type === "rain") {
        return badge + `<span class="weather-cloud one"></span><span class="weather-cloud two"></span><span class="weather-lightning"></span>` + weatherParticleMarkup("weather-drop", 22);
      }
      if (type === "snow") {
        return badge + `<span class="weather-cloud one"></span><span class="weather-cloud three"></span>` + weatherParticleMarkup("weather-snowflake", 24);
      }
      if (type === "fog") {
        return badge + `<span class="weather-mist-band one"></span><span class="weather-mist-band two"></span><span class="weather-mist-band three"></span>`;
      }
      return badge + `<span class="weather-cloud one"></span><span class="weather-cloud two"></span><span class="weather-cloud three"></span>`;
    }

    function showWeatherAnimation(text) {
      if (state.weatherAnimationTimer) clearTimeout(state.weatherAnimationTimer);
      const overlay = $("weatherAnimationOverlay");
      if (!overlay) return;
      const type = weatherAnimationTypeFromText(text);
      const durationMs = 6000;
      state.weatherAnimationType = type;
      state.weatherAnimationVisible = true;
      overlay.className = "weather-animation-overlay visible weather-" + type;
      overlay.innerHTML = weatherAnimationMarkup(type);
      state.weatherAnimationTimer = setTimeout(function() {
        hideWeatherAnimation();
      }, durationMs);

    async function sendMessage(text, options) {
      options = options || {};
      const input = $("queryInput");
      const query = (text || (input ? input.value : "") || "").trim();
      if (!query || state.isTyping) return;
      const displayText = (options.displayText || query).trim();
      state.messages.push({ role: "user", content: displayText });
      if (input) input.value = "";
      state.isTyping = true;
      render();
      try {
        const history = state.messages.slice(-10).map(m => ({ role: m.role, content: m.content }));
        const data = await apiPost("/api/chat", { query, history, interest: state.interest });
        data.query = data.query || query;
        const answer = data.answer || "抱歉，我暂时没有整理出答案。";
        applyAssistantMeta(data);
        state.messages.push({ role: "assistant", content: answer, meta: responseMeta(data) });
        if (data.route_suggestion && data.route_suggestion.map) highlightRouteOnMap(data.route_suggestion.map);
        speak(answer);
      } catch (e) {
        const fallback = "后端服务暂时没有响应。请确认 `start_server.bat` 正在运行，然后刷新页面再试。";
        state.messages.push({ role: "assistant", content: fallback });
        speak(fallback);
      } finally {
        state.isTyping = false;
        render();
      }

    function emotionLabel(emotion) {
      const labels = {
        neutral: "自然表情",
        happy: "开心讲解",
        thanks: "感谢回应",
        surprised: "惊讶表情",
        confused: "疑惑回应",
        sad: "伤心反思"
      };
      return labels[emotion] || labels.neutral;
    }

    function emotionEnabled() {
      return String(state.config.emotion_enabled || "true") !== "false";
    }

    function assistantEmotion(data) {
      const queryText = data ? (data.query || data.original_query || data.text || "") : "";
      if (data && (data.emotion === "sad" || data.emotion_label === "伤心反思" || isCriticismText(queryText))) return "sad";
      return data && data.emotion ? data.emotion : "neutral";
    }

    function applyAssistantMeta(data) {
      const emotion = assistantEmotion(data);
      const live2dEmotion = emotionEnabled() ? emotion : "neutral";
      state.currentEmotion = live2dEmotion;
      if (data && data.latency_ms !== undefined) state.lastLatencyMs = Number(data.latency_ms);
      postLive2D({ emotion: live2dEmotion, speak: false });
    }

    function isCriticismText(text) {
      const value = String(text || "");
      return /(讲|说|回答|解释|播报).{0,8}(不好|太烂|很烂|太差|很差|不清楚|没讲清楚|听不懂|没听懂|糟糕|敷衍|乱|重新讲|重新说)|什么东西|不满意|失望|好什么好/.test(value);
    }

    function responseMeta(data) {
      const parts = [];
      const emotion = assistantEmotion(data);
      if (emotion === "sad") parts.push("伤心反思");
      else if (data && data.emotion_label) parts.push(data.emotion_label);
      else if (data && data.emotion) parts.push(emotionLabel(data.emotion));
      if (data && data.latency_ms !== undefined) parts.push(`响应 ${data.latency_ms}ms`);
      if (data && data.sources && data.sources.length) parts.push(`引用 ${data.sources.length} 条知识片段`);
      if (data && data.route_suggestion && data.route_suggestion.name) parts.push(data.route_suggestion.name);
      if (data && data.route_suggestion && data.route_suggestion.recommendation_reason) parts.push("推荐理由：" + data.route_suggestion.recommendation_reason);
      return parts.join(" · ");
    }

    async function correctVoiceTranscript(transcript) {
      const raw = String(transcript || "").trim();
      if (!raw) throw new Error("未识别到有效语音。");
      const history = state.messages.slice(-10).map(m => ({ role: m.role, content: m.content }));
      const corrected = await apiPost("/api/voice/correct-text", { text: raw, history, realtime: false });
      const correctedText = String(corrected.text || corrected.corrected_text || raw).trim();
      if (!correctedText) throw new Error("语音纠错后文本为空，请重试。");
      if (correctedText !== raw) {
        state.voiceCorrectionNotice = "已纠正识别：" + raw + " -> " + correctedText;

        state.voiceCorrectionNotice = "";
      }
      render();

        setTimeout(() => {
          if (state.voiceCorrectionNotice === notice) {
            state.voiceCorrectionNotice = "";
            render();
          }
        }, 5000);
      }
      return Object.assign({}, corrected, { text: correctedText });
